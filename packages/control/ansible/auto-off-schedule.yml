---
# Install the auto-off timer on the control plane -- LIVE. #2656, enabled by #2734.
#
#     ansible-playbook auto-off-schedule.yml
#
# ## What this ships
#
# `fleet-auto-off.mjs` decides, per worker, `off` or `keep` and why; `sleep.yml` (reused, not
# reimplemented) does the actual shutdown, busy re-checked immediately before it. This playbook installs
# the systemd unit pair and enables and starts the timer, which fires that decision on a schedule.
# `npm run fleet:auto-off` (no `--apply`) stays report-only regardless; that is a property of the command,
# not of the timer, so a stray manual invocation on the wrong box still finds the report-only default
# rather than a live shutdown.
#
# #2656 shipped this timer disabled, reserving enabling it for the THIRD row, after wake-on-demand was read
# live on the real fleet (#2655/#2657) and the `Fleet-hold-until:` read -- the other reason a power cycle
# might have mattered -- was removed as protecting nothing (ceo's ruling on #2726/#2728, #2737). This is
# that third row: the files exist, are correct, and now actually run.
#
# ## The corpus-schedule.yml shape, one target group over
#
# `corpus-schedule.yml` (#1795) already solved "a job dispatchable only by hand is a job nobody remembers
# to run" for the LAB. This is the identical shape for the CONTROL PLANE: the require-inventory-group
# precondition on localhost, the same "install, then reload only if changed" pattern, and a systemd
# TRIGGER unit (`a11y-fleet-auto-off.service`) whose only job is to invoke the real command -- so a manual
# `npm run fleet:auto-off` and the scheduled firing share one history in `journalctl`.
#
# THE LAB MUST BE IN THE INVENTORY, AND AN EMPTY INVENTORY MUST NOT READ AS SUCCESS -- `ansible-playbook`
# prints `skipping: no hosts matched` and exits 0 on zero hosts, so this runs a `localhost` precondition
# first, exactly as `corpus-schedule.yml` and every other playbook here already do (#1980).
- name: The control plane must be in the inventory before anything claims to have run
  hosts: localhost
  gather_facts: false
  tasks:
    - name: The control plane must be in the inventory
      ansible.builtin.include_tasks: tasks/require-inventory-group.yml
      vars:
        inventory_group: a11y_control
        inventory_group_noun: control plane

    - name: The control-plane key must be supplied
      ansible.builtin.include_tasks: tasks/require-control-plane-key.yml

- name: Install and enable the fleet auto-off timer on the control plane (#2734)
  hosts: a11y_control
  gather_facts: false
  vars:
    auto_off_timer_units:
      - a11y-fleet-auto-off.timer
      - a11y-fleet-auto-off.service

  tasks:
    - name: Install the unit files
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ auto_off_timer_units }}"
      register: auto_off_units_installed

    - name: Pick up any unit that changed
      ansible.builtin.systemd:
        daemon_reload: true
      when: auto_off_units_installed.results | selectattr('changed') | list | length > 0

    # ENABLED AND STARTED (#2734) -- `corpus-schedule.yml`'s own shape, one unit over: the `.timer` is
    # enabled and started, its paired `.service` is neither, because the intended way to fire one run by
    # hand is `systemctl start` on the SAME unit the timer uses, not the timer itself -- see
    # `files/a11y-fleet-auto-off.timer`'s own `Unit=` line, which already names which service it runs.
    #
    # `enabled: true, state: started` rather than a one-time `systemctl enable --now`: idempotent either
    # way, and explicit about the state this playbook GUARANTEES rather than merely not disturbing -- a
    # timer stopped by hand between two runs of this playbook is put back live, because "enabled" is a
    # property of the fleet, not a one-time default nobody re-asserts.
    - name: Enable and start the timer
      ansible.builtin.systemd:
        name: a11y-fleet-auto-off.timer
        state: started
        enabled: true

    # Read back over systemd's own view, not the files just written -- `corpus-schedule.yml`'s own
    # assertion shape, one condition flipped: here the record of correctness is "installed and enabled",
    # never "listed with a next firing".
    - name: Read the unit's own state back
      ansible.builtin.command:
        argv: [systemctl, is-enabled, a11y-fleet-auto-off.timer]
      register: auto_off_timer_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: The timer must be installed and ENABLED -- live from this playbook (#2734)
      ansible.builtin.assert:
        that:
          - "'enabled' in auto_off_timer_enabled.stdout"
        fail_msg: >-
          `systemctl is-enabled a11y-fleet-auto-off.timer` on {{ inventory_hostname }} must say `enabled`
          (#2734: wake-on-demand has been read live and the hold-read is gone, so the timer ships live).
          Got: {{ auto_off_timer_enabled.stdout }}
        success_msg: "a11y-fleet-auto-off.timer is installed and enabled, as #2734 requires"
