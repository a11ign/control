# THE LAB HOLDS EACH LAYER'S CHECKOUT BESIDE THE CORE'S, AT A REF ITS OWN JOB NAMED (ADR 0039 item 6, row 6c,
# #3396). `run-job.yml` moves ONE checkout, `lab_repo_path`, to `lab_ref`. A layer that lives in its own
# repository is a second checkout at its declared path inside that one, and a job that moved only the first would
# run the core at the commit it asked for and the layer wherever its branch last was -- the silent half of the
# pair, the failure `tasks/layer-checkouts.yml` closes on a guest.
#
# THE LAYERS ARE READ FROM `layers.json` AND FROM NOWHERE ELSE (`read-layer-checkouts.yml`), and with none that
# declares a `remote` every task below loops over nothing: this file is a no-op today.
#
# REFUSES rather than falls back, in three places. A layer in its own repository with no ref in `layer_refs` (a
# guessed layer commit is a wrong answer about a repository nobody named); a ref that does not look like a ref,
# held to the SAME pattern as `lab_ref`; and a layer whose checkout is not there, which stops the job naming the
# layer and the path. The core's tree never stands in for a layer that is missing.
#
# `layer_refs` is `{ <layer>: <ref> }`, passed `-e '{"layer_refs": {"nvda-worker": "<ref>"}}'` (lab:job forwards
# every `-e` untouched). A ref resolves ONCE, to a commit, exactly as `lab_ref` does: a branch on origin, else a
# tag or a commit the checkout already has. The checkout then moves only when the core's may (`lab_should_pull`):
# a job that was told not to pull, or that shares the lab with another, leaves BOTH checkouts alone.
- name: "Start from no layer commits, so a second include in one play does not read the first's"
  ansible.builtin.set_fact:
    lab_layer_commits: {}

- name: "Which layers live in their own repository"
  ansible.builtin.include_tasks: read-layer-checkouts.yml

- name: "Every such layer has a ref of its own, and no ref names anything else"
  ansible.builtin.assert:
    that:
      - (a11y_layer_checkouts | map(attribute='key') | list | difference((layer_refs | default({})).keys() | list)) | length == 0
      - ((layer_refs | default({})).keys() | list | difference(a11y_layer_checkouts | map(attribute='key') | list)) | length == 0
    fail_msg: >-
      layer_refs must name EVERY layer that lives in its own repository and nothing else.
      Those layers: {{ a11y_layer_checkouts | map(attribute='key') | list | to_json }}.
      Given: {{ (layer_refs | default({})).keys() | list | to_json }}.
      Pass -e '{"layer_refs": {"<layer>": "<ref>"}}'. There is no default: a guessed layer ref is a wrong
      answer about a repository nobody named.

- name: "A layer ref must look like a ref"
  ansible.builtin.assert:
    that:
      - item.value is match('^[A-Za-z0-9._/-]{1,100}$')
      - "'..' not in item.value"
    fail_msg: "layer_refs[{{ item.key }}] must be a plain branch, tag or commit name, got: {{ item.value }}"
  loop: "{{ (layer_refs | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: "A layer path must be a plain relative path"
  ansible.builtin.assert:
    that:
      - item.value.path is match('^[A-Za-z0-9._/-]{1,100}$')
      - "'..' not in item.value.path"
    fail_msg: "layers.json declares {{ item.key }} at '{{ item.value.path }}', which is not a plain relative path"
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"

- name: "Is each layer's checkout there"
  ansible.builtin.stat:
    path: "{{ lab_repo_path }}/{{ item.value.path }}/.git"
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"
  register: lab_layer_git

- name: "A layer's checkout must be there, and the core's tree does not stand in for it"
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      layer {{ item.item.key }} is declared at {{ item.item.value.path }}, and
      {{ lab_repo_path }}/{{ item.item.value.path }} is not a git checkout. Nothing falls back to the core's
      tree: run bootstrap-control-plane.sh on this host, or correct the path in packages/control/layers.json.
  loop: "{{ lab_layer_git.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: "Fetch each layer's origin"
  # UNCONDITIONAL for the reason the core's fetch is: it writes only to `.git`, so it is safe on a dirty
  # checkout and beside a running job, and it is the only way to know how far behind a layer is.
  ansible.builtin.command:
    argv: [git, fetch, --quiet, origin]
    chdir: "{{ lab_repo_path }}/{{ item.value.path }}"
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

- name: "Resolve each layer's ref as a branch on origin"
  ansible.builtin.command:
    argv: [git, rev-parse, --verify, --quiet, "refs/remotes/origin/{{ layer_refs[item.key] }}^{commit}"]
    chdir: "{{ lab_repo_path }}/{{ item.value.path }}"
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  failed_when: false
  register: lab_layer_as_branch

- name: "Failing that, as a tag or a commit the layer already has"
  when: item.rc != 0
  ansible.builtin.command:
    argv: [git, rev-parse, --verify, --quiet, "{{ layer_refs[item.item.key] }}^{commit}"]
    chdir: "{{ lab_repo_path }}/{{ item.item.value.path }}"
  loop: "{{ lab_layer_as_branch.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: false
  failed_when: false
  register: lab_layer_as_object

- name: "Settle the commit each layer runs at"
  ansible.builtin.set_fact:
    lab_layer_commits: >-
      {{ lab_layer_commits | default({}) | combine({ item.item.key:
         ((item.stdout | trim) if item.rc == 0
          else ((lab_layer_as_object.results[idx].stdout | default('')) | trim)) }) }}
  loop: "{{ lab_layer_as_branch.results }}"
  loop_control:
    index_var: idx
    label: "{{ item.item.key }}"

- name: "A layer ref must resolve to a commit, and say so when it does not"
  ansible.builtin.assert:
    that: (lab_layer_commits[item.key] | default('')) | length == 40
    fail_msg: >-
      layer {{ item.key }}: ref '{{ layer_refs[item.key] }}' names no branch on its origin, no tag, and no
      commit this checkout has after fetching. Push it first, or name a branch.
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"

- name: "Move each layer to its commit, when the core's checkout may move"
  # `--detach <commit>` exactly as the core's move: a checkout, not a merge, so a run at a branch and the run
  # back at main are both explicit acts the stamp records.
  when: lab_should_pull | bool
  ansible.builtin.command:
    argv: [git, checkout, --quiet, --detach, "{{ lab_layer_commits[item.key] }}"]
    chdir: "{{ lab_repo_path }}/{{ item.value.path }}"
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: true

- name: "Read each layer's HEAD back"
  ansible.builtin.command:
    argv: [git, rev-parse, HEAD]
    chdir: "{{ lab_repo_path }}/{{ item.value.path }}"
  loop: "{{ a11y_layer_checkouts }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  register: lab_layer_heads

- name: "The layer is on the commit the job was told to run, or the job says it is not"
  # A job that was left alone (`pull=false`, another job running, somebody's work in the lab) runs at whatever
  # is there, and the stamp records that rather than hides it: so this FAILS only when the move was permitted.
  when: lab_should_pull | bool
  ansible.builtin.assert:
    that: item.stdout | trim == lab_layer_commits[item.item.key]
    fail_msg: "layer {{ item.item.key }} is on {{ item.stdout | trim }}, not {{ lab_layer_commits[item.item.key] }}."
  loop: "{{ lab_layer_heads.results }}"
  loop_control:
    label: "{{ item.item.key }}"
