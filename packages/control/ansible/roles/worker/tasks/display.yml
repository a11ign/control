---
# #1567: the display mode the fleet pins. `ceo`'s #1561 ruling (b) -- the capture window is what a real
# display holds, so the display is what gets pinned -- and `worker_display_mode` in `defaults/main.yml`
# carries the value (1024x768 by default) the same way `worker_edge_version` carries the browser build.
#
# THE DRIVER HALF, below the mode task. Workers 7-11's Intel UHD Graphics 630
# (`PCI\VEN_8086&DEV_3E91&SUBSYS_83EF103C&REV_00`) runs Microsoft's Basic Display Adapter with
# `CM_PROB_FAILED_POST_START` (error 43); no Intel package is staged in any of their five driver stores
# (orchestrator's sizing read, #1567 2026-09-14T09:56:11Z). Workers 2-6 already run Intel Corporation
# 31.0.101.2115 (2022-11-16), but Intel does not archive that exact file or publish a checksum for it, and
# a third-party mirror's hash is not something this role will pin for a SYSTEM-privilege fleet-wide
# install (#1567 2026-09-19T14:22:40Z). `ceo`'s ruling (#1567, 2026-09-19T14:40:36Z) pins the CURRENT
# official package instead (31.0.101.2141), sourced and hashed by a person through Intel's real Download
# Center -- never a value taken from a mirror or invented here. The chairman sourced the URL from Intel's
# own Download Center and hashed the download; this checkout's own session independently re-fetched the
# same URL and got the identical sha256 (#1782), and running it a third time while writing this file
# reproduced it again.
#
# GATED PER ADAPTER, NOT FLEET-WIDE. This task only fires where the live read below shows something other
# than an Intel driver with no problem code, so workers 2-6 -- already `CM_PROB_NONE` on Intel -- are never
# touched by it and stay on 2115. `fleet-consistency.mjs`'s `MUST_MATCH` has no GPU-driver-version field,
# only `provisionRevision` (a hash of this role's own declared files), which stays equal fleet-wide as long
# as one `defaults/main.yml` provisions everyone -- so 2-6 staying on 2115 while 7-11 land on 2141 does not
# split the fleet (ceo, #1567 2026-09-19T14:40:36Z).
#
# NO AUTOMATIC REBOOT, AND `-overwrite` IS DELIBERATELY LEFT OFF. `-b` is omitted so the installer
# completes without restarting anything on its own (installation_readme.txt, section VII); this role
# performs the reboot itself, through `win_reboot`, so it is visible to Ansible rather than sprung by the
# installer mid-play. `-overwrite` exists to let a silent install proceed over a NEWER Intel driver than
# the one being installed -- not our case here, since the gate only fires when the adapter is NOT already
# a problem-free Intel driver, so there is nothing to regress from. Passing it unconditionally would let a
# future re-run silently downgrade a driver that had since been updated by some other route, with nothing
# to show that happened -- the same "two faults must not print the same word" reasoning `edge-version.yml`
# already applies to `ALLOWDOWNGRADE`.
#
# EXIT CODES 17/18 ARE TREATED AS FAILURES, NOT SUCCESSES, AND THIS IS THE LOAD-BEARING LINE IN THIS FILE.
# The package's own `installation_readme.txt` (section VIII) documents 2 and 14 as "successful, reboot
# needed" -- a software-controlled restart, safe for `win_reboot` to perform remotely. 17 and 18 mean the
# installer is SHUTTING THE BOX DOWN, and section III says that when a firmware update runs, "it is highly
# recommended to perform a full system shutdown ... the user should manually power the system back on".
# This fleet is bare-metal with nobody guaranteed on site; a box that powers off expecting a human to press
# its button is a box this role cannot bring back. So 17/18 fail the task loudly rather than being folded
# into the same reboot handling as 2/14 -- a green result here must not be the thing that leaves a worker
# dark. Nothing in the 2026-09-14 sizing read suggests these integrated adapters carry a firmware payload,
# but the read never ruled it out either, and "probably doesn't apply" is not a justification for treating
# 17/18 the same as 2/14 when the failure mode is a machine nobody can walk over to.
#
# ## Why this runs through `run-interactive.yml`, not a direct `win_powershell` task
#
# It used to be a `win_powershell` task here, run straight over the SSH connection like the rest of this
# file. Live against the real fleet (#1567, 2026-09-21) it failed on all 10 hosts at the very first call:
# `EnumDisplaySettings could not read the current display mode`, and NOT only under `become`/SYSTEM --
# the same call failed as the console-session `witness` account too. `tasks/run-interactive.yml`'s own
# header already names the reason for a different API (`SystemParametersInfo`): SSH does not attach to the
# interactive window station, so a GDI call that needs one fails regardless of which account runs it.
# `EnumDisplaySettings`/`ChangeDisplaySettings` are exactly that class of call. The fix is the same
# mechanism `provision.yml` already uses for `provision-nvda-worker.ps1` -- a one-shot scheduled task with
# `logon_type: interactive_token`, which attaches to the session the auto-logon already established -- so
# the P/Invoke itself moved out to `set-display-mode.ps1`, a real file `run-interactive.yml` can `&`-invoke,
# rather than staying inline here where only a direct module call could run it.
#
# `ansible.windows` ships nothing for display resolution -- the collection's own module index has no
# `win_display*` entry, which is why that script reaches `user32.dll` by P/Invoke rather than a module.
#
# The trade: the old `win_powershell` task supported `ansible-playbook --check`; a scheduled task run
# through `run-interactive.yml` does not, the same as every other interactive step in this role.
#
# ## #1955, 2026-09-22: THAT MOVE WAS NECESSARY AND IT WAS NOT THE WHOLE FAULT
#
# The paragraph above stated #1833's conclusion as settled. It was shipped on 2026-09-21 and first run
# against the real fleet on 2026-09-22, where it failed on 10 of 10 hosts with the same sentence as
# before. That reads like the interactive route not working. It is not what happened, and the diagnostic
# `set-display-mode.ps1` now carries says so in its own output: on a11y-worker-2, inside the one-shot
# task, `sessionId=1`, `windowStation='WinSta0'`, `desktop='Default'`, `GetSystemMetrics
# screen=1024x768 monitors=1`. The interactive session is real, the desktop is the interactive one, and
# the desktop has a display. Everything this paragraph claims the mechanism provides, it provides.
#
# The second fault was in the script, and it was THE DEVICE ARGUMENT -- but not for the reason this
# paragraph gave until #1968's rework, and the correction matters because the first version blamed the
# fleet for something PowerShell did. Measured on the same box, in the same task, seconds apart:
# `EnumDisplaySettingsW($null, CURRENT)` -> False, and `EnumDisplaySettingsW('\\.\DISPLAY1', CURRENT)`
# -> True, 1024x768.
#
# READ WHAT `$null` IN THAT FIRST CALL ACTUALLY SENT. PowerShell converts `$null` to `[string]::Empty`
# when it binds a `string` parameter; only `[NullString]::Value` sends a genuine NULL. Measured under
# pwsh 7.6.6 against a C# `s == null` probe: literal `$null` arrives as "not-null, length 0". So the
# failing call asked for a display device NAMED `""`, which no machine has and any Windows box refuses.
# **This was a PowerShell binding trap, not a property of these workers**, and the readings establish
# only that an EMPTY-named call refuses while a named call answers -- never anything about a real NULL
# device, because no call ever passed one.
#
# The fix is unchanged by that correction: the script obtains the primary display's name from
# `MonitorFromPoint`/`GetMonitorInfoW` and passes it explicitly, and `ChangeDisplaySettings` became
# `ChangeDisplaySettingsEx`, which is the form that can take a name.
#
# Keep the interactive route. Both faults were real, and the second could not have been separated from
# the first until the first was fixed -- but NOT for the reason this paragraph used to give. It claimed
# that "in session 0 every display call fails whatever device you name", and nobody has measured a NAMED
# display call in session 0: this role's own session-0 account (`tasks/run-interactive.yml`) names
# `SystemParametersInfo`, guidepup's NVDA start, and `become_user`'s profile writes, and no display-mode
# call at all.
#
# The real reason is simpler and is measured: the script only ever made EMPTY-named calls, and in
# session 0 the run failed for the session's reason as well. Two candidate causes, one symptom, and no
# way to tell them apart -- so #1833 removing the session variable is what left a single explanation
# standing, not any property of session 0 that anyone has read.
#
# ## THE MODE IS PINNED LAST, AFTER THE DRIVER, AND THAT ORDER IS LOAD-BEARING (#1955)
#
# It used to be the FIRST task in this file, and that was a chicken-and-egg this role could never get out
# of. Measured on a11y-worker-7, 2026-09-22T19:07Z, with #1955's device-name fix already in place: the
# mode reads fine (`current mode reads 640 x 480`), and then
#
#     ChangeDisplaySettingsEx returned -2 (wanted 0) setting 1024 x 768 on '\\.\DISPLAY1'
#
# `-2` is DISP_CHANGE_FAILED -- the display driver refused the mode. 640x480 is the Microsoft Basic
# Display Adapter's fallback, which is exactly what workers 7-11 are on while their adapter carries
# error 43; a basic adapter cannot do 1024x768, so the mode could not be pinned until the Intel driver
# below had been installed. With the mode task running FIRST, the play failed here and the driver install
# underneath it NEVER RAN -- the very step that would have made the mode settable. Workers 2-6, already on
# a problem-free Intel driver, passed the same task in the same run (`already 1024 x 768`), which is what
# makes this an ordering fault rather than a second defect in the script.
- name: What the display adapter's driver actually is
  become: true
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $dev = Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Select-Object -First 1
      $drv = Get-CimInstance Win32_PnPSignedDriver -Filter "DeviceClass='DISPLAY'" -ErrorAction SilentlyContinue |
        Select-Object -First 1
      "$(if ($dev) { [string]$dev.Problem } else { '(absent)' })|" +
        "$(if ($drv) { $drv.DriverProviderName } else { '(absent)' })|" +
        "$(if ($drv) { $drv.DriverVersion } else { '(absent)' })"
  changed_when: false
  check_mode: false
  register: display_driver_state

- name: Whether this adapter already has a problem-free Intel driver
  ansible.builtin.set_fact:
    # `.split('|')` reads the pipe-joined string above -- see the task's own header comment for why this
    # is gated per adapter rather than fleet-wide.
    display_driver_ok: >-
      {{ (display_driver_state.output | first).split('|')[0] == 'CM_PROB_NONE'
         and 'Intel' in (display_driver_state.output | first).split('|')[1] }}

- name: What it would do
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: display adapter problem {{ (display_driver_state.output | first).split('|')[0] }},
      driver {{ (display_driver_state.output | first).split('|')[1] }} {{ (display_driver_state.output | first).split('|')[2] }}
      {{ '— already a problem-free Intel driver' if display_driver_ok
         else '— would install ' ~ worker_display_driver_url }}

- name: Refuse to install a display driver on a worker that is mid-capture
  # Same shape and same reason as edge-version.yml's own health check: installing means the display
  # subsystem changes under whatever NVDA and the browser are doing, and a busy worker must not have that
  # sprung on it.
  when: not display_driver_ok
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ worker_port }}/health"
    return_content: true
  register: display_driver_worker_health
  failed_when: display_driver_worker_health.json.busy | default(true)

- name: Fetch the pinned Intel display driver installer
  # Only when it would change something: this is a ~280 MB download onto a box that may be mid-corpus.
  when: not display_driver_ok
  become: true
  ansible.windows.win_get_url:
    url: "{{ worker_display_driver_url }}"
    dest: "{{ worker_display_driver_path }}"
    checksum: "{{ worker_display_driver_sha256 }}"
    checksum_algorithm: sha256
    force: false

- name: Install it silently, without a reboot the installer sprung itself
  # `-overwrite` deliberately absent; exit-code handling in the task's own header comment.
  when: not display_driver_ok
  become: true
  ansible.windows.win_command: >-
    {{ worker_display_driver_path }} -s --report C:\Windows\Temp\IntelGFX-install-{{ worker_display_driver_version }}.log
  register: display_driver_install
  failed_when: display_driver_install.rc not in [0, 2, 14]
  changed_when: true

- name: Reboot if the install asked for a software-controlled restart
  when: not display_driver_ok and display_driver_install.rc in [2, 14]
  become: true
  ansible.windows.win_reboot:
    reboot_timeout: 600

- name: Refuse to call this provisioned unless the adapter reads clean afterwards
  when: not display_driver_ok
  become: true
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $dev = Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Select-Object -First 1
      $drv = Get-CimInstance Win32_PnPSignedDriver -Filter "DeviceClass='DISPLAY'" -ErrorAction SilentlyContinue |
        Select-Object -First 1
      $problem = if ($dev) { [string]$dev.Problem } else { '(absent)' }
      $provider = if ($drv) { $drv.DriverProviderName } else { '(absent)' }
      if ($problem -ne 'CM_PROB_NONE' -or $provider -notlike '*Intel*') {
        $Ansible.Failed = $true
        return "display adapter problem $problem, provider $provider — expected CM_PROB_NONE and an Intel driver"
      }
      "$provider $($drv.DriverVersion), $problem"
  register: display_driver_proof

- name: Say what the display adapter is on
  # `display_driver_proof` is only REGISTERED when `not display_driver_ok` (the task above it shares
  # that guard) -- on workers 2-6, already a problem-free Intel driver, it is a skipped result with no
  # `.output`, and reading it unconditionally failed strict templating there, touching a worker this
  # role must leave alone. `display_driver_state` (unconditional, above) already has the pre-existing
  # reading for exactly that case; the two are read in the same "provider version, problem" shape so
  # the message does not depend on which branch produced it.
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ display_driver_proof.output | first if not display_driver_ok else
         ((display_driver_state.output | first).split('|')[1] ~ ' ' ~
          (display_driver_state.output | first).split('|')[2] ~ ', ' ~
          (display_driver_state.output | first).split('|')[0]) }}

- name: The display mode the fleet pins
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/run-interactive.yml"
  vars:
    interactive_name: a11y-display-mode
    interactive_command: >-
      $env:A11Y_DISPLAY_WIDTH = '{{ worker_display_mode.width }}';
      $env:A11Y_DISPLAY_HEIGHT = '{{ worker_display_mode.height }}';
      & "{{ worker_repo_path }}\packages\worker-fleet\src\provisioning\set-display-mode.ps1"
    interactive_timeout: 60
