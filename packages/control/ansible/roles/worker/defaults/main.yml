---
# Everything the worker role can be pointed at. These mirror provision-nvda-worker.ps1's own env-var
# defaults (A11Y_REPO_PATH, A11Y_TASK_NAME, A11Y_PORT) rather than re-deciding them, because a role that
# configures one path while the worker reads another leaves a box that provisions cleanly and serves
# nothing.
worker_repo_url: https://github.com/DanBeckDev/a11y-witness.git
worker_repo_path: 'C:\Users\witness\a11y-witness'
worker_task_name: a11ysrv
worker_check_task_name: a11ycheck
worker_port: 8765

# ---------------------------------------------------------------------------------------------------
# Browser policy. The VALUES here are trivial; their derivation is the asset, so each carries its own
# reason. Applied under HKLM, so these tasks are elevated.
#
# Read this list as evidence control, not as preference. Every entry changes what a capture HEARS.
# ---------------------------------------------------------------------------------------------------
worker_edge_policy:
  # A brand-new Edge profile shows a welcome/sign-in surface. On a page with no headings, NVDA quick-nav
  # escapes the empty document into that browser UI and records it as phantom elements
  # ("Welcome to Microsoft Edge") -- page findings that are not about the page.
  - { name: HideFirstRunExperience, value: 1 }
  - { name: BrowserSignin, value: 0 }

  # Stop Edge doing anything we did not ask for. A capture launches and kills Edge once per capture --
  # 90 times in a dataset run -- and background work racing that leaks processes and adds guest noise.
  #
  # Observed after a 45-pair run: 5 msedge processes alive on an idle, freshly booted machine with zero
  # captures run, plus WER crash reports from MicrosoftEdgeUpdate.exe and Edge's own setup.exe
  # (EdgeInstallerError 0x220). Edge was updating itself underneath the run.
  - { name: BackgroundModeEnabled, value: 0 }
  - { name: StartupBoostEnabled, value: 0 }

  # Autofill draws a suggestion icon inside recognised inputs, and NVDA announces it as an embedded
  # object (U+FFFC) appended to the field announcement. Whether it appears depends on what the durable
  # profile has LEARNED, so the same page announces differently over the life of a run -- measured
  # rising from 3% to 31% of affected captures as the profile accumulated, with 26 good/bad pairs in the
  # corpus disagreeing about it. Off, so a form-field announcement is a property of the PAGE.
  - { name: AutofillAddressEnabled, value: 0 }
  - { name: AutofillCreditCardEnabled, value: 0 }
  - { name: PasswordManagerEnabled, value: 0 }

  # Edge's COMPONENT updates, which are separate from the browser updates turned off below and were not
  # covered by anything above. Measured on this fleet, from `/diagnostics`:
  #
  #   worker-2/3/4   component_crx_cache 184 MB + ProvenanceData 169 MB   = 353 MB of 445 MB
  #   worker-5       component_crx_cache  28 MB + ProvenanceData absent   (newest box, had not yet)
  #
  # The point is not the disk. `Default` — the profile holding everything a CAPTURE touches — is 13-14 MB
  # on every box including the one that has run the most, so captures accumulate nothing. That 353 MB is
  # Edge fetching its own components in the background, which is exactly the class of thing this appliance
  # already refuses elsewhere: `BackgroundModeEnabled` is off because background work "racing that leaks
  # processes and adds guest noise", and EdgeUpdate is off because "an installer runs unannounced while we
  # are driving the browser". Component downloads do both and were simply not on the list.
  - { name: ComponentUpdatesEnabled, value: 0 }

# THE EDGE BUILD THE WHOLE FLEET RUNS, declared once, in git — the same rule as the inventory being the
# single source of truth for which boxes exist.
#
# It has to be declared and installed rather than left to the updater, because **the EdgeUpdate registry
# policies below do not apply to these machines**. Microsoft documents twelve of them, `UpdateDefault` and
# the per-app `Update{56EB18F8-…}` among them, as "available only on Windows instances that are joined to a
# Microsoft Active Directory domain". These are standalone boxes. So the values provisioning writes are
# STORED and never honoured, and reading them back — which this role does — proves only that they are
# stored. Measured 2026-08-21: `UpdateDefault=0` read back correctly on all four guests and a11y-worker-2
# updated itself from 151.0.4129.93 to .101 anyway, four days into a five-day uptime.
#
# `browserVersion` is a capture cache key, so a guest that drifts fragments the corpus. `fleet:status`
# reports the split — once `fileProductVersion` stopped memoising the value for the life of the process,
# which is what hid this one for five days.
#
# The URL and hash come from Microsoft's enterprise catalogue, https://edgeupdates.microsoft.com/api/products?view=enterprise.
# Pinned by CHECKSUM, not just by URL: the point is a build we can name, and an unverified download would
# make the version claim rest on a hostname.
# MOVED FORWARD 2026-08-25, .101 -> .107, and the direction is forced rather than chosen.
#
# a11y-worker-5 auto-updated to .107 against a pin of .101 and CANNOT BE BROUGHT BACK: Chromium's
# installer declines to install over a newer build, and Windows blocks uninstalling Edge outside the EEA.
# Both were established by running them, not inferred. So a fleet that drifts forward has exactly two
# ways back — reimage the guest, or follow it — and following it is one download against a reimage.
#
# It cost no cache. `environmentKey` keys on `browser/browserVersion` and all 3,210 corpus captures
# record that field as ABSENT, so their key already reads `.../unknown` and already fails to match any
# live guest. The corpus was cache-invalid before this change and is no more invalid after it.
#
# URL and hash come from Microsoft's own enterprise release API
# (https://edgeupdates.microsoft.com/api/products?view=enterprise), which publishes the SHA256 — so the
# pin is a fact about the bytes rather than a claim about a hostname.
# FOLLOWED FORWARD to 152.0.4191.62 on 2026-09-04, which is this pin's documented behaviour rather than an
# exception to it: "a fleet that drifts forward has exactly two ways back -- reimage the guest, or follow
# it -- and following it is one download against a reimage."
#
# a11y-worker-7 arrived on 152 because first boot had no Edge step at all (now fixed). Rolling it back is
# possible -- `msiexec /I ... ALLOWDOWNGRADE=1` is Microsoft's supported enterprise rollback, and the
# refusal below saying otherwise was wrong -- but following costs one download per box against a rollback
# on one, and rollback is documented as "a temporary fix ... risks exposure to known security issues".
# This build fixes 21 CVEs at Critical severity.
#
# STILL NO CACHE COST, and it was checked rather than assumed this time: a synthetic corpus capture from
# the 2026-09-04 recapture reads `browserVersion: ABSENT`, so its key already resolves to `.../unknown`
# and already fails to match any live guest. The corpus was cache-invalid before this change and is no
# more invalid after it -- the same reason the 151 bump cost nothing.
worker_edge_version: "152.0.4191.66"
worker_edge_msi_url: "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/2757513f-2ec6-4bb1-b23a-5738a92d7a56/MicrosoftEdgeEnterpriseX64.msi"
worker_edge_msi_sha256: "5bcf8cd57351ddaa94419f800f8d90b8cbaf2b485b49d9ddb07d055b76a518df"
# The binary is the source of truth for "which Edge is installed", not the registry's recorded version.
# Same rule the worker itself now follows: it reported a version it was not running for five days because
# the value was read once and cached, and the file on disk had moved underneath it.
worker_edge_dir: 'C:\Program Files (x86)\Microsoft\Edge\Application'
worker_edge_exe: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
worker_edge_msi_path: 'C:\Windows\Temp\MicrosoftEdgeEnterpriseX64-{{ worker_edge_version }}.msi'

# ROLLING A BOX BACK TO THE PIN IS OPT-IN, AND MUST STAY OPT-IN.
#
# `msiexec ... ALLOWDOWNGRADE=1` is Microsoft's documented enterprise rollback, and `edge-version.yml`'s
# refusal has named it as remedy (2) since that refusal was corrected. What it did NOT have was a way to
# perform it: the remedy was a shell command for a human to type on the box, which is the hand-cranking
# this fleet is built to avoid -- and the only path left when remedy (1) is unavailable, as it was on
# 2026-09-04 when a box came up on 152.0.4191.66 and the enterprise channel published no such build.
#
# Default false, and NOT because the flag is unreliable. A rollback is documented as "a temporary fix
# that risks exposure to known security issues", so which build a working box runs is a decision a person
# makes; the pin says what the fleet WANTS, not what may be silently forced onto a machine that is
# already serving. Turning this on fleet-wide by default would make every forward drift self-healing in
# the direction of the OLDER browser, which is the wrong default for a security update and would also
# hide the drift itself.
#
# UNTESTED ON THIS FLEET, AND IT HAS NOW SURVIVED ITS FIRST INTENDED USE BY BEING THE WRONG ANSWER.
# The 2026-08-25 measurement recorded in `edge-version.yml` established that a PLAIN install will not go
# backwards -- it ran `/quiet /norestart` with no such flag, which is exactly the case ALLOWDOWNGRADE
# exists to override -- so it says nothing about this path, and nothing since has exercised it.
#
# BEFORE REACHING FOR THIS, RE-QUERY THE ENTERPRISE CHANNEL. On 2026-09-04 a box self-updated to
# 152.0.4191.66 while the API's newest Stable x64 was .62, and the honest conclusion at that moment was
# that following forward was impossible. It was published at 22:28 UTC the same day -- roughly the minute
# that conclusion was drawn. So a box can be AHEAD OF THE ENTERPRISE CHANNEL BY HOURS, not for ever, and
# a measurement of a moving index expires. The remedy was already running when the re-query refuted it.
#
# That is the shape to remember: the fleet's policy is to FOLLOW FORWARD, and the only thing that had ever
# argued against it here was an availability check that was simply early.
worker_edge_allow_downgrade: false

# The updater's tasks and services, stopped and disabled BECAUSE the policy cannot do it here. Blunt, and
# the only lever that actually holds on a non-domain-joined box. Provisioning never touched these: they were
# found `Ready` on every guest while the policy that was supposed to make them inert sat unhonoured.
worker_edge_updater_tasks:
  - MicrosoftEdgeUpdateTaskMachineCore
  - MicrosoftEdgeUpdateTaskMachineUA
worker_edge_updater_services:
  - edgeupdate
  - edgeupdatem

# On a workstation Edge auto-update is right; on a capture appliance it means an installer runs
# unannounced while we are driving the browser.
#
# KEPT even though it is not honoured on a non-domain-joined machine, because it costs nothing, it is
# correct if one of these ever is domain-joined, and removing it would read as "we decided auto-update is
# fine". What changed is that it is no longer the mechanism relied upon — see `worker_edge_version`.
worker_edge_update_policy:
  - { name: UpdateDefault, value: 0 }
  - { name: AutoUpdateCheckPeriodMinutes, value: 0 }

# Nothing may pop to the foreground uninvited. A capture works by forcing the browser to the front and
# reading what NVDA announces; a notification that steals focus mid-capture corrupts the evidence, and
# one that merely sits over the page does it silently. Observed on the guest: OneDrive offering
# "Turn On Windows Backup" during a run.
worker_quiet_policy:
  - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Explorer'
    name: DisableNotificationCenter
    value: 1
  - path: 'HKLM:\SOFTWARE\Policies\Microsoft\OneDrive'
    name: DisableFileSyncNGSC
    value: 1
  - path: 'HKLM:\SOFTWARE\Policies\Microsoft\OneDrive'
    name: PreventNetworkTrafficPreUserSignIn
    value: 1
  # Windows must not choose its own downtime. During one 94-minute dataset run Windows Update rebooted
  # the worker TWICE mid-capture -- event id 1074, "winlogon.exe has initiated the power off ... on
  # behalf of NT AUTHORITY\SYSTEM", at 09:02:55 and 09:09:30. The run only survived because auto-logon
  # plus the at-logon task self-heal, and the outages happened to fall between cases.
  #
  # Updates still download and install; only the REBOOT waits for a human. The policy keys on "a user is
  # logged on", which auto-logon guarantees on this fleet.
  - path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    name: NoAutoRebootWithLoggedOnUsers
    value: 1

# Per-USER suggestion surfaces. These live in HKCU, which is why the tasks that write them must not be
# becomed to SYSTEM -- see tasks/policy.yml.
worker_content_delivery_values:
  - SubscribedContent-338389Enabled
  - SubscribedContent-310093Enabled
  - SoftLandingEnabled
  - SystemPaneSuggestionsEnabled
