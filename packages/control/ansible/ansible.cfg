# Ansible settings for the capture fleet.
#
# Committed rather than left to each operator's ~/.ansible.cfg, for the reason this repo keeps
# relearning: configuration that lives on one machine is configuration that differs between machines,
# and a fleet whose members are configured differently produces evidence that cannot be compared.
[defaults]
inventory = inventory.yml
# Our own collection lives in the repo, BEFORE the user-level path -- so a checkout is self-contained and
# a11y.worker cannot be shadowed by, or go missing because of, whatever is installed on a given control
# plane. The two defaults are repeated explicitly because setting this key REPLACES them, and dropping
# ~/.ansible/collections would make community.windows vanish with a "module not found" that points at the
# playbook rather than at this line.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
# Fact gathering costs a PowerShell round trip per host and nothing here needs it. The playbooks that
# DO need a fact ask for exactly that fact.
gathering = explicit
# YAML-shaped task output. This used to be `stdout_callback = yaml`, which resolves to
# `community.general.yaml` -- REMOVED in community.general 12.0.0, and this control plane is on 13.3.0.
# The failure is total and misleading: EVERY playbook aborts before running a single task, with an error
# naming the plugin rather than this file, so `wake.yml`, `deploy.yml` and `provision-role.yml` all look
# individually broken. ansible-core 2.13+ does the same thing natively.
stdout_callback = default
callback_result_format = yaml
# Per-task timings, so "provisioning is slow" is answerable with a number. It lives in ansible.posix,
# which requirements.yml pins — and enabling a callback that is NOT installed aborts every playbook
# before its first task, which is what `stdout_callback = yaml` did to this fleet until this morning.
# So the order is install, verify with `ansible-galaxy collection list`, then add this line. Verified
# with `collection list` rather than `ansible-doc`, which resolves things that are not installed.
callbacks_enabled = ansible.posix.profile_tasks
# The fleet is 6-12 machines; run them all at once rather than in batches of five.
forks = 20
# A play that stops at the first unreachable box is useless for a fleet where one box is always off.
any_errors_fatal = false

[ssh_connection]
# MULTIPLEXING IS ON, AND THE COMMENT THAT TURNED IT OFF WAS WRONG.
#
# It read: "Windows OpenSSH does not support ControlPersist multiplexing, and leaving it on produces a
# connection error that reads like an auth failure." Tested 2026-09-05 against a11y-worker-2 and -3 with
# `ControlMaster=auto`: both answered `pong`. The claim conflates the two ends — ControlMaster is a
# CLIENT-side feature, the client here is this Linux control plane, and Windows OpenSSH's documented gap
# is as a client. Nothing was being asked of the Windows side that it does not do.
#
# Measured, 10 tasks x 4 hosts, interleaved, three rounds:
#
#     current        33s    400s (HUNG, timed out)    34s
#     multiplexed    27s     26s                      26s
#
# So ~0.7 s per task, which is about a minute off the role's 90 tasks -- worth having and NOT the large
# win it looks like at first glance, because the cost per task is dominated by spawning PowerShell on the
# guest rather than by the handshake. Anyone tempted to chase the remaining time should start there.
#
# The hang is the more interesting half and is NOT established: one occurrence in three rounds, with the
# multiplexed side steady at 26-27 s throughout. A fresh connection per task is the thing that can stall,
# and from outside that presents as "provisioning is taking forever" rather than as an error.
#
# ControlPath is under /tmp on the control plane, which is the only machine that runs these playbooks.
# ControlPersist is deliberately SHORT: long enough to span one playbook's tasks, short enough that a
# stale socket cannot outlive the run and be reused against a box that has since rebooted -- which
# provisioning does to itself.
#
# `accept-new` is trust-on-first-use: an unknown host is accepted and REMEMBERED, a host whose key later
# CHANGES is still refused. Without it, every newly installed box fails its first play with
# "Host key verification failed" — which reads as an auth or network problem and is neither. That is a
# hole in a fleet meant to install itself: a11y-worker-3 hit it on the run that was meant to prove
# provisioning works end to end.
#
# Deliberately NOT `host_key_checking = False`, which would also accept a key that changed underneath us
# and is a bigger concession than the problem needs.
ssh_args = -o ControlMaster=auto -o ControlPath=/tmp/a11y-cm-%h-%p-%r -o ControlPersist=60s -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new
# Left OFF and not measured. Pipelining feeds a module over stdin to avoid a temp-file round trip, which
# is a POSIX shape; the Windows connection does not work that way, so there is no reason to expect a win
# and a real chance of a confusing failure. Recorded as untested rather than as a decision.
pipelining = false
