---
# Bring a named artifact back from the lab, so it can be read properly.
#
#     ansible-playbook lab-fetch.yml -e artifact=training-report -e out=multidefect
#
# ## Why this exists
#
# `lab-status.yml` shows the journal, and the journal WRAPS AND TRUNCATES every line. A training report is
# JSON with per-head calibration detail, and read through the journal it arrives as fragments —
# `"4.1.2:unnamed-control: no threshold` with the rest cut off. On 2026-08-23 that made it impossible to
# say WHY a candidate failed its release gate, and the honest answer to "do the three whys" was "I cannot,
# I have no way to read the evidence".
#
# So this is the missing half of ADR 0013: that ADR gave the lab a way to RUN things and no way to read
# what they produced. A job interface that can start a 4-hour training run and cannot return its report
# leaves you diagnosing from log fragments, which is where this project's worst misdiagnoses have started.
#
# ## Read-only, and a NAME rather than a path
#
# Nothing here mutates. The artifact is chosen from a fixed list and the model directory from the same
# enum `lab-job.yml` uses, so a path cannot be expressed — the containment `worker`, `role` and `out`
# already have, for the same reason: this box holds the corpus and the fleet key.
- name: Fetch an artifact from the lab
  hosts: a11y_lab
  gather_facts: false

  vars:
    lab_artifacts:
      training-report: "runs/model-{{ out | default('candidate') }}/training-report.json"
      acceptance-report: "runs/model-{{ out | default('candidate') }}/acceptance-report.json"
      shipped-acceptance: "runs/model-shipped-baseline/acceptance-report.json"
      false-positives: "runs/model-{{ out | default('candidate') }}/false-positives.json"
      abstention-sweep: "runs/real-page-corpus/abstention-sweep.json"
      capture-progress: "runs/screenreader-dataset/capture-progress.json"
      # ONE CORPUS CAPTURE, by case id. Added 2026-08-28, when `rules:gate` named two conformant records it
      # had failed -- `keyboard-trap-modal-cycle.good` and one of its variants -- and nothing could show what
      # the rule SAW on them. The same capture taken from a laptop was clean, so the lab's differed, and the
      # difference WAS the defect. There was no way to look.
      #
      # That is this file's own reason for existing, one artifact further in: a report that names a failing
      # page and cannot produce that page's evidence has the same hole as a job that can start a 4-hour run
      # and cannot return its report. The comment on `grants-audit` says exactly this about held-out records.
      #
      # `-e capture=<case>.<variant>`, validated as a NAME: letters, digits, dot, plus and dash only, so
      # `../../etc/passwd` is inexpressible rather than rejected -- the shape `isValidCaptureId` uses, whose
      # test says "path traversal is the reason this check exists".
      capture: "runs/screenreader-dataset/captures/{{ capture | default('') }}.json"
      # THE REAL-PAGE CAPTURES, added 2026-09-04 because there was no way to read one.
      #
      # `rules-real-pages` refused a run with a new 1.1.1 finding on cqc.org.uk and its own output said
      # "Read the evidence for each before doing anything else" -- and the evidence was on the lab with
      # nothing able to fetch it. The `capture` entry above points at the SYNTHETIC corpus only, so the
      # alternative was loading the live site, which answers a different question: these are pages their
      # publishers keep editing, so the page today is not the page captured. That distinction is one of
      # the three causes the rule asks you to separate, and it was unanswerable.
      #
      # The name is the URL slugged: `capture-real-pages` writes `${slug(page.url)}.json`, where slug
      # strips the scheme and replaces every non-alphanumeric run with a hyphen. So
      # `https://www.cqc.org.uk/search/all?query=hospital` is
      # `www-cqc-org-uk-search-all-query-hospital`.
      real-page-capture: "runs/real-page-corpus/{{ capture | default('') }}.json"
      # THE HELD-OUT RECORDS THEMSELVES. Added 2026-08-25, when an acceptance false positive named a page
      # and nothing could show what the model SAW on it -- which is this file's own reason for existing,
      # one artifact further in: "a job interface that can start a 4-hour training run and cannot return
      # its report leaves you diagnosing from log fragments". A report that names a failing page and
      # cannot produce that page's evidence has the same hole.
      #
      # Read-only and enumerated like every other entry; the repeat is a NAME from a fixed list, never a
      # path, so `runs/../../etc/passwd` is inexpressible rather than rejected.
      # THE EXPORTED DATASET, added 2026-09-06 for the same reason `capture` was added on 2026-08-28 — and
      # for the SAME CASE, which is why it is worth writing down rather than just adding.
      #
      # That entry's comment says: "`rules:gate` named two conformant records it had failed --
      # `keyboard-trap-modal-cycle.good` and one of its variants -- and nothing could show what the rule
      # SAW on them." Tonight `rules:gate` named those same two again, the capture was fetched with that
      # entry, and running the CURRENT compiled rule against that capture's real values produced NO
      # finding: `ringOffersNoWayOut` false on one, `escapeReleasedFocus` true on the other, both branches
      # gated shut. So the rule does not fire on the CAPTURE, and it demonstrably fires on the RECORD.
      #
      # The difference is the export, and there was no way to look at it — one artifact further in again,
      # exactly as that comment predicted. A gate that names a failing record and cannot produce the record
      # it scored is the same hole as one that cannot produce the page's evidence.
      #
      # It is large (~13 MB at 2,796 records) and that is the cost of being able to answer the question at
      # all. `training:export` writes it; `rules:gate`, `rules:score` and the featurizer all read it.
      dataset-export: "runs/screenreader-dataset/screenreader-evidence.jsonl"
      grants-audit: "runs/grants-audit.json"
      # THE REAL-PAGE BASELINE, which `rules-real-pages-update` writes and which is TRACKED — so accepting
      # a finding on the lab dirties the checkout and blocks every later job until it is committed here.
      # It was not fetchable, so the only route back was to re-derive it locally from a `runs/` copy that
      # is only ever as fresh as its last sync. Same gap the promoted changeset had, same fix.
      real-page-baseline: "packages/lab/baselines/real-page-findings.json"
      # EVERY STAGE'S FULL OUTPUT from the whole-chain run. The runner prints a six-line tail per stage to
      # keep nine stages legible, and captures the child's stdout to do it — so without this the detail
      # reaches nobody. The first green run fetched at 63 lines against the previous 400, with `RULES:
      # PASS` and its per-criterion table simply absent: a pass whose evidence had been discarded.
      everything-transcript: "runs/everything-transcript.log"
      # The RETRAIN chain's own record. `everything-transcript` holds the nine top-level stages in full,
      # but `retrain` is one of them and is itself a pipeline in a child process, so what reaches the
      # parent is retrain's six-line-per-stage TAIL. Measured 2026-09-01: `build-realism` prints one line
      # per head and only the last three survived. This is where its five stages are kept whole.
      retrain-transcript: "runs/retrain-transcript.log"
      # A TRACKED file the lab writes, so it dirties the checkout and blocks the next pull until it is
      # committed here — the same trap the promoted weights spring, and the reason `lab:reset` exists.
      # Fetchable so the round trip is a CLI operation rather than an ssh one.
      shortcuts-baseline: "packages/lab/scripts/scorer-shortcuts.baseline.json"
      # THE VETO DETAIL, and it was unreachable at the moment it mattered. `promote` refuses on a veto
      # REGRESSION and names only the worst one per subtype; the pairs go to `runs/unclosable-vetoes.json`
      # and the transcript truncates the closable list at "... and 13 more".
      #
      # Measured 2026-09-01: `2.4.2:route-title-stale` went 1 -> 5 closable vetoes with its positives
      # unchanged at 14 and its worst veto the same feature at the same weight — so the corpus did not move
      # and the retrain did. Deciding whether those four are genuinely closable, or belong in the unclosable
      # map beside the identical ones already classified for 2.1.1 and 2.1.2, needs the LIST. There was no
      # way to get it without an ssh shell, which is what this file exists to remove.
      #
      # Same lesson as `grants-audit`, one report along: "a report that exists only as stdout is one a job
      # runner can lose. Write it to runs/ and make it fetchable."
      unclosable-vetoes: "runs/unclosable-vetoes.json"
      # THE CLOSABLE ones, which is the half `promote` refuses on and the half nothing could show. The
      # audit printed only the worst veto per subtype and wrote no report at all; the pairs existed solely
      # in a truncated transcript. Same remedy as `grants-audit`, and the reason it was needed twice is
      # that "write it to runs/" is a habit rather than a mechanism.
      shortcuts: "runs/scorer-shortcuts.json"
      # THE PROMOTED WEIGHTS THEMSELVES. `promote:gated` runs on the lab, because that is the only place
      # the candidate and the code both exist -- and it deliberately does not commit, since promoting is a
      # MAJOR release of @a11y-witness/scorer and a job that can push is a job that can release by
      # accident. So the artefacts sit uncommitted on a box a human cannot reach without ssh, which is the
      # hand-crank this whole interface exists to remove.
      #
      # Read-only and enumerated like every other entry. Binary, so `fetch` handles it; the checksum is
      # verified by Ansible on arrival, which matters more here than for a report.
      promoted-weights: "packages/scorer/models/screenreader-scorer/model.safetensors"
      # THE CHANGESET THE PROMOTION WROTE, which is the only record of WHY those weights moved and what
      # version bump they imply. It was the one promotion output that could not be fetched, so bringing a
      # release back meant reconstructing its changeset by hand — a second spelling of the release note,
      # written by whoever happened to be doing it. The name is fixed by `promote:model`; `out` selects
      # which candidate produced it, exactly as the reports above do.
      # A GLOB, and it has to be. This read `.changeset/promote-{{ out }}-4.md` -- a literal sequence
      # number, true on the day it was written and wrong by the next promotion. The lab was holding
      # `promote-candidate-6.md` while this looked for `-4`, so THE ONE ARTEFACT THIS ENTRY EXISTS TO
      # RESCUE WAS UNFETCHABLE, and the comment above describing that rescue read as if it worked.
      #
      # The number is now a hash of the release (`promote-model.mjs`), because counting the directory
      # made one promotion overwrite another's note. That is unguessable by design, so this resolves the
      # newest match on the lab instead of predicting a name.
      promoted-changeset: ".changeset/promote-*.md"
      promoted-training-report: "packages/scorer/models/screenreader-scorer/training-report.json"
      promoted-acceptance-report: "packages/scorer/models/screenreader-scorer/acceptance-report.json"
      acceptance-records: "runs/screenreader-acceptance/{{ repeat | default('repeat-1') }}.jsonl"

  tasks:
    - name: A repeat is a NAME from a fixed list, never a path
      when: repeat is defined
      ansible.builtin.assert:
        that: repeat in ['repeat-1', 'repeat-2']
        fail_msg: "-e repeat= must be repeat-1 or repeat-2. It is a name, not a path."

    # A CASE ID IS A NAME, NEVER A PATH. `regex_findall` rather than `regex_search`: a non-match makes
    # Ansible call `.group()` on None and throw INSIDE the filter, so no `| default` afterwards can save the
    # message -- a guard that stops the job and explains nothing gets distrusted, then bypassed.
    - name: A capture id must be a name, so a path cannot be expressed
      when: artifact | default('') == 'capture'
      ansible.builtin.assert:
        that:
          - capture | default('') | length > 0
          - (capture | regex_findall('^[A-Za-z0-9.+-]+$')) | length > 0
        fail_msg: >-
          -e capture=<case>.<variant> is required for artifact=capture, e.g.
          keyboard-trap-modal-cycle.good. It is a NAME (letters, digits, dot, plus, dash), never a path.

    - name: The artifact must be one we have, and the model directory a name
      ansible.builtin.assert:
        that:
          - artifact is defined
          - artifact in lab_artifacts
          - out | default('candidate') in ['candidate', 'multidefect', 'varied', 'scratch']
        fail_msg: >-
          Pass -e artifact=<name>, one of: {{ lab_artifacts.keys() | list | join(', ') }};
          optionally -e out=candidate|multidefect|scratch. Both are NAMES, never paths.

    # RESOLVED ON THE LAB, never predicted here. `find` rather than a shell glob: no shell is involved,
    # and it returns mtimes so "newest" is a fact rather than a sort of whatever order the FS gave back.
    - name: Resolve a globbed artifact to the file it names
      when: "'*' in lab_artifacts[artifact]"
      ansible.builtin.find:
        paths: "{{ lab_repo_path }}/{{ lab_artifacts[artifact] | dirname }}"
        patterns: "{{ lab_artifacts[artifact] | basename }}"
      register: lab_globbed

    # A REFUSAL, not an empty fetch. Slurping a path that matched nothing fails with a file-not-found
    # naming a pattern, which reads like a broken playbook rather than "that promotion left no changeset".
    - name: There must be a file for a globbed artifact to name
      when: "'*' in lab_artifacts[artifact]"
      ansible.builtin.assert:
        that: (lab_globbed.files | default([])) | length > 0
        fail_msg: >-
          nothing on the lab matches {{ lab_artifacts[artifact] }}. For promoted-changeset that means no
          promotion has written one there -- run `lab:job -e job=promote` first, or the promotion you are
          thinking of was already committed and fetched.

    - name: Settle which path to read
      ansible.builtin.set_fact:
        lab_fetch_src: >-
          {{ (lab_globbed.files | sort(attribute='mtime') | last).path
             if ('*' in lab_artifacts[artifact])
             else (lab_repo_path ~ '/' ~ lab_artifacts[artifact]) }}

    - name: "Read {{ artifact }}"
      ansible.builtin.slurp:
        src: "{{ lab_fetch_src }}"
      register: fetched

    # To a fixed local directory, named for the artifact and the model it describes — so two fetches of
    # different candidates cannot overwrite each other and leave you reading the wrong one, which is the
    # failure this whole exercise is about.
    # The extension comes from the SOURCE, not from a hardcoded `.json`. Every artifact was JSON until
    # `promoted-weights` (a safetensors binary), and writing that as `.json` would name a file after a
    # format it is not — the sort of quiet wrongness that survives until somebody parses it.
    #
    # TAKEN from the source path rather than special-cased, because the special case was already wrong the
    # first time a THIRD format appeared: `promoted-changeset` is markdown and landed as `.json`. A
    # two-way `if` over an open set is a list that has to be remembered, which is this repo's definition
    # of a rule that gets broken.
    - name: Name it after what it actually is
      ansible.builtin.set_fact:
        lab_fetch_dest: >-
          {{ playbook_dir }}/../../../runs/fetched/{{ out | default('candidate') }}.{{ artifact
             }}{{ (lab_fetch_src | splitext)[1] | default('.json', true) }}

    # CLEAR THE SAME ARTIFACT UNDER A DIFFERENT EXTENSION FIRST, or a stale one outlives its replacement.
    #
    # The destination is named after the artifact's REAL extension, which is right and is why this is
    # needed: when an artifact's source format changes, the old file does not go anywhere. It sits beside
    # the new one under a near-identical name and nothing distinguishes them but an mtime nobody reads.
    #
    # Measured 2026-09-05, at three round trips. `acceptance-records` is `.jsonl`; a
    # `candidate.acceptance-records.json` from 25 August — eleven days stale — sat next to it, and I
    # grepped the `.json` three times, concluded a fix had not worked, invented two wrong causes and acted
    # on both: a full re-capture and a full regenerate of the held-out set. The fetch had succeeded every
    # time and had PRINTED where it landed; it was piped to /dev/null.
    #
    # So the tool was not at fault and the remedy is still here rather than in the operator, for this
    # repo's usual reason: "a stale value read as a current one" is its most-repeated defect, and asking a
    # human to check an mtime is a rule that gets broken. Removing the siblings makes the wrong file
    # impossible to read rather than merely unlikely.
    - name: Remove any stale copy of this artifact under another extension
      ansible.builtin.shell:
        cmd: >-
          find "{{ lab_fetch_dest | dirname }}" -maxdepth 1
          -name "{{ lab_fetch_dest | basename | splitext | first }}.*"
          ! -name "{{ lab_fetch_dest | basename }}" -delete
      delegate_to: localhost
      changed_when: false

    - name: Write it locally
      ansible.builtin.copy:
        content: "{{ fetched.content | b64decode }}"
        dest: "{{ lab_fetch_dest }}"
        mode: "0644"
      delegate_to: localhost

    # AND WHERE IT CAME FROM, which for a GLOBBED artifact is the only place its real name survives.
    #
    # `promoted-changeset` is `.changeset/promote-*.md` and the local copy is flattened to
    # `candidate.promoted-changeset.md`, so the name `promote:model` chose is discarded at exactly the
    # moment it matters. CLAUDE.md already records why that name is load-bearing: commit the file under
    # any other name and the lab's copy stays untracked at a path origin does not have, so `run-job.yml`
    # refuses every later job. Measured 2026-08-30 at three round trips, and again 2026-09-01 at four —
    # the second time by me, working around this playbook because it would not tell me one string it had
    # already computed. A tool that withholds what it knows gets improvised around, which is this file's
    # own definition of a defect.
    - name: Where it landed
      ansible.builtin.debug:
        msg:
          - "{{ lab_fetch_dest | regex_replace('^.*/runs/', 'runs/') }}"
          - "from {{ lab_fetch_src | regex_replace('^' ~ lab_repo_path ~ '/', '') }} on the lab"
