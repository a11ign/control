# ADDRESSES ARE RFC 5737 DOCUMENTATION ADDRESSES (192.0.2.0/24, TEST-NET-1), changed 2026-09-18.
# They used to be RFC 1918 private ones, which #63's history purge redacted to a single constant
# string -- leaving every host in this example pointing at the same non-address and the tests that
# read it unable to tell two workers apart. A documentation range is what an EXAMPLE should have
# carried anyway: it is reserved, never routable, and the leak guards allow it by name.
# EXAMPLE — placeholder addresses only. The real `inventory.yml` is gitignored and restored from the
# secrets store at bring-up on the control plane; see CLAUDE.md and packages/control/ansible/README.md.
#
# This file exists so `ansible-check.yml`'s `--syntax-check` has something real to validate in CI, where
# the real inventory never exists, and so the three tests that read a real inventory file directly
# (`fleet-discover.test.ts`, `fleet-env.test.ts`, `claude-md-counts.test.ts`) have a committed target.
# Worker NAMES and COUNT are kept identical to production, because those are not secrets and
# `claude-md-counts.test.ts` reads them to check CLAUDE.md's stated fleet size. Only the addresses and
# MAC addresses are placeholders.
#
# KEEP THIS FILE'S SHAPE IN STEP WITH THE REAL ONE. `inventory-example-parity.test.ts` compares the two
# structurally (group names, host names, and the set of keys each host declares) whenever the real file is
# present locally — it skips honestly, not silently, when it is not (a fresh clone or CI).
all:
  children:
    a11y_workers:
      hosts:
        a11y-worker-2:
          ansible_host: 192.0.2.12
          mac: "00:00:00:00:00:12"

        a11y-worker-3:
          ansible_host: 192.0.2.13
          mac: "00:00:00:00:00:13"

        a11y-worker-4:
          ansible_host: 192.0.2.14
          mac: "00:00:00:00:00:14"

        a11y-worker-5:
          ansible_host: 192.0.2.15
          mac: "00:00:00:00:00:15"

        a11y-worker-6:
          ansible_host: 192.0.2.16
          mac: "00:00:00:00:00:16"

        a11y-worker-7:
          ansible_host: 192.0.2.17
          mac: "00:00:00:00:00:17"

        a11y-worker-8:
          ansible_host: 192.0.2.18
          mac: "00:00:00:00:00:18"

        a11y-worker-9:
          ansible_host: 192.0.2.19
          mac: "00:00:00:00:00:19"

        # a11y-worker-10 — REJOINED 2026-09-09, withdrawn 2026-09-07. It never needed the console visit.
        #
        # Measured directly on 2026-09-09: /health answered 200, SSH port 22 was OPEN, and only ICMP was
        # down — and ICMP loss on a Windows box is the firewall's default, never evidence. Uptime was
        # 4.6 days, so it had not rebooted since before the withdrawal: whatever failed on the 7th was a
        # PATH to it, not the box. `provisionRevision` already matched the fleet, so it rejoined with a
        # deploy and a recover, never a provision, and no cache key moved.
        #
        # `ready` was false only because a `ShellExperienceHost` notification held the foreground.
        # `fleet:deploy`'s reboot is CONDITIONAL and skipped here; `fleet:recover` is what cleared it.
        #
        # Full record in `docs/operational-lessons.md`. The real `inventory.yml` carries the identical
        # comment; change BOTH together, or `inventory-example-parity.test.ts` fails and says so.
        a11y-worker-10:
          ansible_host: 192.0.2.20
          mac: "00:00:00:00:00:20"

        a11y-worker-11:
          ansible_host: 192.0.2.21
          mac: "00:00:00:00:00:21"

    a11y_control:
      hosts:
        a11y-control:
          ansible_host: 192.0.2.2

    a11y_lab:
      hosts:
        a11y-lab:
          ansible_host: 192.0.2.3

    a11y_hypervisor:
      hosts:
        pve-micro:
          ansible_host: 192.0.2.1
