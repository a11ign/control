# The merge gate. Every pull request and every merge-queue entry runs lint, the typecheck and the tests (`checks`), the changeset check (`changeset`), the playbook checks (`ansible`) and the release's
# version step on a scratch clone (`release-dry-run`, which works only when the change touches what the release installs from), and the last job below, `gate`, waits for all four. It is named `gate` because that is the check `main`'s protection and the `merge-queue-main` ruleset require (`docs/code-repository-protection.json` in
# a11ign/a11ign names it). `merge_group` is what lets the queue's temporary branches run it: a required check that never runs on one blocks the queue for ever.
#
# THIS REPOSITORY IS NOT SELF-CONTAINED, AND CI SAYS SO BY CONSTRUCTION (a11ign/a11ign#2704). `control` has no dependency of any kind (ADR 0012), so it reaches the code beside it by
# relative path: the fleet's `packages/worker-fleet` (22 imports), the lab's `packages/lab`, and the core's `scripts/` and `guards`. The job therefore LAYS this package OVER a
# checkout of a11ign/a11ign at the commit pinned in `CORE_REF`, and runs the core's own eslint, tsc and rstest config over it: the one toolchain, not a copy of it.
#
# THE PACKAGE IS THIS REPOSITORY'S ROOT (a11ign/a11ign#4217), AND THE CORE STILL KNOWS IT AS `packages/control`. Every `packages/control/...` the code and the tests name is that LAID path, in the
# core's checkout and on the control plane (`/root/a11y-witness/packages/control/...`), and it does not move when this repository's layout does. What the lay step below decides is which of the
# root's files make up the package there: `src/`, `ansible/`, `layers.json` (the playbooks' own list, until the host row), `deploy-pins.json` (control's declaration, a11ign/a11ign#5085), `pnpm-lock.yaml` (`control-has-no-dependencies.test.ts` reads the layers' production closure from it, a11ign/a11ign#5312), `CLAUDE.md` and `README.md`, with a `package.json` cut down to what the core's `pnpm install --frozen-lockfile` can
# hold (its lockfile has `packages/control` with no dependencies, so the root's `devDependencies` must not arrive). The same list is the next row's, where the core lays the package on a host.
# `packages/worker-fleet` is the one the pinned core carries. Laying screenreader-fleet's own repository over it was tried and does not work: its manifest pins `@a11ign/judge` and
# `@a11ign/evidence` at 0.1.0, so the core's `pnpm install --frozen-lockfile` refuses ("2 dependencies are mismatched"), and its `dist` is not built.
#
# BUMPING `CORE_REF` IS A PULL REQUEST, and the only way the core's changes reach this repository's CI: Dependabot cannot read a commit pin, so `scripts/ci-composition.test.ts`
# holds it to a full commit sha and nothing else. Ubuntu only, on purpose: the tests here drive nothing real. The fleet's own work runs on the fleet, from the lab.
name: ci

on:
  # `edited` because the changeset check reads the pull request's BODY: adding its `no-release:` line is an edit, and a run that did not repeat would leave the check red on a body
  # that is now right. The cost is the whole gate once per body edit, which is deliberate: the concurrency group below cancels the run an edit interrupts, so an edit must run
  # everything or it would cancel a full run for a partial one.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # a11ign/a11ign#4820's merge (main, 2026-10-10, #4797, step 2 of #4551): the core that pins lab v0.1.28, whose `scripts/*.ts` (build-realism-tier, calibrate-abstention, gate-probe-order, axe-calibration, lab-inventory, stability-gate, corpus-prune-orphans, fleet-hours, evidence-check) sit beside the `.mjs` shims kept for one release, so `ansible/lab-job.yml` and `lab-job.test.ts` name the `.ts` (#4796, step 3). The pin before it, 393f26a92 (#4803's merge), laid lab v0.1.27, whose `scripts/` are still the `.mjs` programs.
  # a11ign/a11ign#4803's merge (main, 2026-10-10, #4785, step 2 of #4519): the core that pins lab v0.1.27, whose `src/gates/qualification-status.ts` exists beside the `.mjs` shim kept for one release, so `post-qualification-status.ts` imports the `.ts` (#4786, step 3). It also locks @a11ign/screenreader-fleet 0.7.3 and nvda-worker 0.9.0. The pin before it, 83b46f522 (#4692's merge), laid lab v0.1.24, which holds only the `.mjs`.
  # a11ign/a11ign#4692's merge (main, 2026-10-10, #4516): the core that locks @a11ign/screenreader-fleet 0.7.2 (its files are `.ts`, and neither `fleet-env.ts` nor `cli-flags.ts` imports a package, so every fleet module this package reaches loads from the control plane's raw checkout, #4680, #4686) and lays lab v0.1.24 and nvda-worker 0.9.0. The pins before it: 78f353032 (#4684's merge) locked fleet 0.7.1, whose `cli-flags.ts` still re-exported `@a11ign/toolchain` and failed `control-has-no-dependencies`; 19a0795 (#4675's merge) locked 0.7.0, whose `fleet-env.ts` did the same; d32bc6cb7 (a draft head) laid 0.6.0, whose `worker-code-check` imported a hasher nvda-worker 0.9.0 no longer ships (#4651). A sha and never a branch: a branch moves under a pull request that did not touch it.
  CORE_REF: c5dddb33d622e547945289b690510fa223ebcb79

jobs:
  # A releasable change needs a changeset or a `no-release:` line (a11ign/a11ign#4127, adopted by #4135). `releasable-paths` is this repository's `dora` entry's `releasablePaths`
  # in a11ign/a11ign `.agent-org/project.json`, character for character: a path that matches nothing passes every pull request. THE CORE'S ENTRY STILL READS `packages/control/` UNTIL ITS OWN
  # ROW LANDS (the one after a11ign/a11ign#4217), and the two are not equal until then. The pin is a full sha, as `release.yml`'s is, and
  # Dependabot's `github-actions` entry moves it. On a merge-group entry the called job succeeds without evaluating (the pull request's own run decided).
  changeset:
    # A called workflow cannot hold more than its caller gives, and this file's `contents: read` alone makes GitHub refuse the whole run at startup (`startup_failure`: no job, no
    # log). The called workflow reads the pull request's files, so it needs `pull-requests: read` too.
    permissions:
      contents: read
      pull-requests: read
    uses: a11ign/toolchain/.github/workflows/changeset-required.yml@745b552ed550f44cc15c9d797718d350730540ce
    with:
      releasable-paths: src/ ansible/ layers.json deploy-pins.json

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: control }
      - uses: actions/checkout@v7
        with: { repository: a11ign/a11ign, ref: "${{ env.CORE_REF }}", path: core }
      # pnpm/action-setup reads the version out of `packageManager`, and comes before setup-node because `cache: pnpm` shells out to it.
      - uses: pnpm/action-setup@v6
        with: { package_json_file: core/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, cache-dependency-path: core/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: core
      # The package is the root here and `packages/control` there. `jq` keeps what the core's workspace resolves by (`name`, `exports`) and what the dependency-free test reads (`dependencies`), and drops
      # what only this repository's own tooling uses. `tsconfig.control.json` is written rather than tracked: this repository holds ONE tsconfig, and this one means nothing outside the lay.
      # The core's tests list files with `git ls-files` (`walkTree`), and the core at `CORE_REF` still TRACKS `packages/control`, so a file this repository renames (a11ign/a11ign#4268) would be listed under its old
      # name and read from a disk that no longer has it. `git add -Af` makes the index say what the lay put on disk; nothing is committed. `-f` because a core that lays this package (a11ign/a11ign#3506) gitignores `/packages/control`, and a plain `add` refuses an ignored path (exit 1, run 37986489972).
      # AFTER the install, not before (a11ign/a11ign#3506): the core's `prepare` lays `a11ign/control` itself, at the tag its `layers.json` declares, so a lay made first is overwritten by that tag's source
      # (run 37987050034 typechecked the OLD `.mjs` imports). That `prepare` laid the fleet layer as well, until a11ign/a11ign#5312: the step after the lay below does it from this repository's `deploy-pins.json`.
      - name: Lay this repository's package over the core's own
        run: |
          rm -rf core/packages/control
          mkdir core/packages/control
          cp -R control/src control/ansible control/layers.json control/deploy-pins.json control/pnpm-lock.yaml control/CLAUDE.md control/README.md core/packages/control/
          jq 'del(.version, .scripts, .devDependencies, .packageManager, .engines)' control/package.json > core/packages/control/package.json
          printf '{ "extends": "./tsconfig.json", "include": ["packages/control/src/**/*.ts"], "exclude": ["packages/guards/src/fixtures"] }\n' > core/tsconfig.control.json
          git -C core add -Af packages/control
      # THE LAYERS THE TESTS READ ARE LAID FROM THIS REPOSITORY'S OWN PINS (a11ign/a11ign#5312). The core's `prepare` used to lay `packages/nvda-worker`, `packages/worker-fleet` and `packages/lab`; the core at
      # `CORE_REF` lays none of them (no `layers.json`), and the tests under `src/control-owned/` read the layers' sources by path. `deploy-pins.json` is where control declares which release of each it deploys,
      # so the lay reads it: a release tag named there, cloned at the path it names. A pin moved there moves what is read here, and no second list can drift from it.
      - name: Lay the layers deploy-pins.json names, beside the core's own
        run: |
          set -o pipefail
          jq -r '(.layers[] | [.remote, "v" + .version, .path]), (.lab | [.remote, .tag, .path]) | @tsv' control/deploy-pins.json |
            while IFS=$'\t' read -r remote tag path; do
              git clone --quiet --depth 1 --branch "$tag" "$remote" "core/${path:?}"
            done
      # Lint and typecheck run before the tests so a style or type failure reads red without waiting for the suite.
      # `--no-ignore`: a core that lays this package lints it nowhere (`packages/control/**` is in its `ignores`, a11ign/a11ign#3506), because the package is linted HERE. Without the flag eslint exits 2 on "all files ignored".
      - run: pnpm exec eslint --no-ignore packages/control
        working-directory: core
      - run: pnpm exec tsc --noEmit -p tsconfig.control.json
        working-directory: core
      - run: pnpm exec rstest run --config scripts/rstest/rstest.config.ts --include "packages/control/**/*.test.ts"
        working-directory: core
      # This repository's own checks: the workflows, the arming filter, the composition above, the manifest. The typecheck (`tsc --noEmit`, `package.json`'s `typecheck`) is a step of the `gate` job
      # the ruleset requires, so a type error here blocks the merge; it runs before the tests so it reads red without waiting for them. The tests are rstest on `@a11ign/toolchain`'s config
      # (`scripts/rstest/rstest.config.ts`, ADR 0043), the same runner the core's step above uses.
      - run: pnpm install --frozen-lockfile
        working-directory: control
      # THE LAYOUT CHECK (ADR 0043, Decision 7; `@a11ign/toolchain`'s `layout-check`, a11ign/a11ign#4210): the package is at the root, with one README, one manifest and no workspace file. It
      # is a step of the job `gate` waits for, so a monorepo layout that comes back by habit blocks the merge. It reads the files, so it runs beside the typecheck and before the tests.
      - run: pnpm run layout-check
        working-directory: control
      - run: pnpm run typecheck
        working-directory: control
      - run: pnpm test
        working-directory: control

  # THE PLAYBOOKS ARE CHECKED WHERE THEY LIVE (a11ign/a11ign#4919, part of #4425). The core's own `ansible` job laid this repository over its checkout and ran these two checks on `packages/control/ansible`; the
  # core is dropping that copy, and a product job is deleted only after the same check has run green in the layer's own CI. So this is the check MOVED, not a second one: it reads `ansible/` at the
  # root and needs nothing from the core, which is why it stands beside `checks` rather than inside it (that job lays a core it does not need here, and a lint or test failure there would hide a playbook one).
  # It runs on EVERY pull request and not only one that touches `ansible/`: `gate` accepts `success` only, so a path filter that skipped the job would read red, and the cost is one small job.
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # `ansible-core`, not the full `ansible` metapackage: the metapackage bundles hundreds of collections this fleet does not use.
      - run: pip install ansible-core pyyaml
      - name: Install the collections these playbooks import
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Every playbook still parses
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          status=0
          for playbook in ansible/*.yml; do
            # The two files that are not playbooks are NAMED, and everything else is checked. The core's job skipped whatever lacked a top-level `hosts:`, which skips a playbook whose `hosts:` is
            # MISTYPED (`host:`): `ansible-playbook` rejects it ("'host' is not a valid attribute for a Play", exit 4) and the filter never handed it over. A new top-level file that is not a playbook
            # fails here by name, and that is the prompt to add it to this list; roles/, tasks/ and group_vars/ are directories and the glob does not reach them.
            case "$playbook" in ansible/inventory.example.yml|ansible/requirements.yml) continue ;; esac
            echo "--- $playbook ---"
            ansible-playbook -i ansible/inventory.example.yml --syntax-check "$playbook" || status=1
          done
          exit $status
      # `--syntax-check` parses and resolves module NAMES and never looks at an argument, so an invented option passes it and fails on the box. This reads each module's own documentation.
      - name: Every module invocation matches what the module actually documents
        working-directory: ansible
        run: python3 check-modules.py

  # A PULL REQUEST THAT CHANGES HOW THIS TREE INSTALLS DRY-RUNS THE RELEASE'S VERSION STEP (a11ign/a11ign#5066; a11ign/agent-org#888, #885 class 3 and a11ign/a11ign#4988, the job of a11ign/agent-org#967). A change to
  # `package.json`, the lockfile or a workflow that breaks the install passes `checks` and shows first as a failed release on `main`: nothing on the pull request ran the path `release.yml` takes (the shared
  # `release-per-merge.yml`'s `version` job: with a lockfile, `pnpm install --frozen-lockfile`, the repository's OWN `changeset version`, then `pnpm install --lockfile-only`; without one, `pnpm dlx
  # @changesets/cli@<changesets-version> version`). This job runs those commands in a scratch clone of the candidate tree and writes nothing: `contents: read`, no credential kept by the checkout, no push, no token.
  #
  # IT RUNS ON EVERY EVENT AND DOES ITS WORK ONLY WHEN THE CHANGE TOUCHES `package.json`, `pnpm-lock.yaml`, `.npmrc` OR `.github/workflows/`. GitHub filters `paths:` per WORKFLOW and not per job, and a
  # workflow-wide filter would skip `gate` with it, so the job reads the paths itself and the steps after `touched` are conditional on it: an untouched change is a `success` here, never a skip, and `gate`
  # keeps accepting `success` alone. The paths are judged against the first parent of the checked-out commit: the merge ref of a pull request or a merge-queue entry.
  #
  # THE TOOLS ARE THIS REPOSITORY'S RELEASE'S, NOT agent-org's: `release.yml` passes `kind` and `gate-check` and no `pnpm-version`, `changesets-version` or `node-version`, so the shared workflow's rules apply and are
  # repeated here. pnpm comes from `packageManager` (an empty `version` makes `pnpm/action-setup` read it, as the release's does); Node is the shared workflow's default `22`; the repository has a lockfile, so the
  # release runs the repository's own `@changesets/cli` and `CHANGESETS_VERSION` (the shared workflow's default) is read only by the branch a pull request that deletes the lockfile would reach. It versions EVERY
  # changeset in the tree, where the release versions only those no tag has consumed: a superset, so a failure the release would meet is met here.
  #
  # THE CHECKOUT AND THE VERSION STEP'S CLONE ARE FULL-DEPTH. `changeset version` reads git history and DEEPENS a shallow clone, and on a `--depth=1` one it spins (agent-org#967's first run hung 29 minutes there;
  # screenreader-fleet#33, screenreader-worker#47 and toolchain#40 fixed the same hang with `fetch-depth: 0`).
  #
  # NO CONSUMER-INSTALL STEP, ON PURPOSE. agent-org#967 adds a second step that runs what a11ign's `agent-org-newest-tag` runs on a tag (`pnpm install --frozen-lockfile --ignore-scripts`). Nothing installs a tag of
  # THIS repository: it is published to no registry and holds no dependency (ADR 0012), and a11ign's `scripts/lay-layer.ts` lays `control` by cloning the tag and copying the files `layers.json` names, with no install.
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHANGESETS_VERSION: 3.0.3
    steps:
      - uses: actions/checkout@v7
        with:
          # The WHOLE history, not two commits: `touched` needs only HEAD and its first parent, but the version step clones this checkout and `changeset version` deepens a shallow clone and hangs (see the job's header).
          # No credential is kept: nothing here pushes.
          fetch-depth: 0
          persist-credentials: false
      - name: Does the change touch what the release installs from?
        id: touched
        run: |
          set -euo pipefail
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "changed paths:"
          echo "$changed"
          if grep -q -E '^(package\.json|pnpm-lock\.yaml|\.npmrc)$|^\.github/workflows/' <<<"$changed"; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no install-affecting path changed: the release dry run is not needed"
          fi
      # No `version`: the action reads `packageManager`, which is what the release's pnpm comes from here.
      - uses: pnpm/action-setup@v6
        if: steps.touched.outputs.touched == 'true'
      - uses: actions/setup-node@v7
        if: steps.touched.outputs.touched == 'true'
        with:
          node-version: 22
      - name: The release's version step, dry-run on a scratch clone -- install, changeset version, lockfile refresh
        if: steps.touched.outputs.touched == 'true'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-dry-run"
          git clone --quiet "file://$GITHUB_WORKSPACE" "$scratch"
          cd "$scratch"
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm exec changeset version
            pnpm install --lockfile-only
          else
            pnpm dlx "@changesets/cli@$CHANGESETS_VERSION" version
          fi

  # THE REQUIRED CHECK. `main`'s protection and the `merge-queue-main` ruleset name `gate`, so it stays the one check that answers for the run. It waits for the four jobs above and
  # accepts `success` ONLY: `always()` because a job whose need failed is SKIPPED, and a skipped required check counts as passed; and no `skipped` allowance, because the changeset
  # job succeeds on a merge-group entry rather than skipping, so a skip here means it did not run.
  gate:
    needs: [changeset, checks, ansible, release-dry-run]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran, and ran clean
        run: |
          for result in "${{ needs.changeset.result }}" "${{ needs.checks.result }}" "${{ needs.ansible.result }}" "${{ needs.release-dry-run.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a job reported '$result', not success"
              exit 1
            fi
          done
