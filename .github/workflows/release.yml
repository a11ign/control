name: release

# A RELEASE IS A GIT TAG, AND NOTHING ELSE, CUT BY THE ONE WORKFLOW EVERY a11ign REPOSITORY SHARES (ADR 0043; a11ign/a11ign#3960; the shared workflow is a11ign/toolchain's
# `release-per-merge.yml`, a11ign/a11ign#3712 and its parity row #3964). This file is only the CALLER: what a push to `main` means for the release (the gate wait, the release commit on no
# branch, the atomic never-forced tag push, the Release notes) is that workflow's, and its tests are there.
#
# control is published to NO registry: it is the code that runs on the machine holding the fleet's SSH key and has no dependency (ADR 0012), so there is nothing to install it from but a
# checkout. What a consumer pins is a TAG of this repository, `v<version>`, and `kind: tag` is the shared workflow's name for "a tag and a GitHub Release, and no registry".
#
# THE ROOT IS THE PACKAGE (a11ign/a11ign#4217), SO THE VERSION AND THE CHANGELOG ARE ITS OWN (`package.json`, `CHANGELOG.md`) AND A CHANGESET NAMES `@a11ign/control`. Until then the root was a private
# `control-workspace` shell over a package in `packages/control`, and this comment said why the version lived in the shell: `kind: tag` tags only the private package AT THE ROOT, as `v<version>`
# (`releasable` in `release-per-merge.mjs`), and a private package below it is never tagged, so with the version in `packages/control` the first call released nothing (`released=false`, measured on
# #3960). That special case is gone with the directory; nothing in this file's logic depended on it. `main`'s own version and changelog lag the last tag, by design: the shared workflow rebases the
# root on the last tag, so the numbering runs on from `v0.1.8`.
#
# `id-token: write` IS HERE BECAUSE GITHUB CHECKS A CALLED WORKFLOW'S PERMISSIONS BEFORE ANY JOB RUNS: the shared file's `publish` job asks for it, and a caller that does not grant it is
# refused as a whole. `kind: tag` SKIPS `publish` (its `if:` needs `kind == 'npm'`), so no job here ever holds a token, and `release-workflow.test.ts` pins `kind: tag`, which is what
# makes the grant inert. If a registry is ever wanted that is a later decision under a name the chairman owns.
#
# THE CALLER PINS THE SHARED WORKFLOW BY FULL SHA, and Dependabot's `github-actions` entry moves the pin in a pull request reviewed here: a tag that followed `main` there would let a
# push to a11ign/toolchain change what this repository releases with no pull request here.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      checks: read
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    uses: a11ign/toolchain/.github/workflows/release-per-merge.yml@ab856fdd429c8989789dcc369c10b229b0833f2c
    with:
      kind: tag
      gate-check: gate
