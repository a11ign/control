---
# The worker service, and the on-demand capture-check runner.
#
# Every parameter below was chosen for a reason that has already cost this project something, so none of
# them is a default worth "tidying". `win_scheduled_task` expresses all of them declaratively, which is
# the single clearest module win in the port — but the values are the asset, not the module.

- name: Find the node the task must launch
  # Baked into the task definition as an ABSOLUTE path rather than derived at launch. The task's
  # environment has neither %ProgramFiles% set correctly nor node on PATH, and the symptom of getting
  # that wrong is a console window that opens and closes in two seconds with nothing written anywhere.
  ansible.windows.win_powershell:
    script: |
      $candidates = @(
        (Join-Path $env:ProgramFiles 'nodejs\node.exe'),
        'C:\Program Files\nodejs\node.exe',
        (Join-Path $env:LOCALAPPDATA 'Programs\nodejs\node.exe')
      )
      $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
      if (-not $found) { $found = (Get-Command node -ErrorAction SilentlyContinue).Source }
      if (-not $found) { throw 'node.exe not found -- refusing to register a task that would fail at launch' }
      $Ansible.Changed = $false
      $found
  register: node_exe
  changed_when: false

- name: Register the worker task
  become: true
  community.windows.win_scheduled_task:
    name: "{{ worker_task_name }}"
    description: a11ign NVDA capture worker
    actions:
      - path: "{{ worker_repo_path }}\\packages\\nvda-worker\\src\\run-server.cmd"
        # Quoted because the path contains spaces.
        arguments: '"{{ node_exe.output | first }}"'
    username: "{{ ansible_user }}"
    # MANDATORY. A service, or anything launched over plain SSH, has no desktop — and guidepup reports
    # that as "nvda.start failed: NVDA is not supported", which reads like a broken install and is not
    # one. NVDA is a GUI application; it needs a real logged-on session.
    logon_type: interactive_token
    # `limited`, NOT `highest`, and deliberately so: guidepup drives nvda_noUIAccess.exe, which cannot
    # read ELEVATED windows at all. An elevated worker captures nothing, silently.
    run_level: limited
    triggers:
      # What makes the worker self-healing across reboots. Without it the task sits at "Ready" forever
      # and the machine looks dead after a restart.
      - type: logon
        username: "{{ ansible_user }}"
    # The at-logon trigger covers a reboot but NOT a crash: when the worker process died the task went
    # back to "Ready" and stayed there, so the box answered nothing until someone logged on again.
    # Observed for real — an NVDA socket error killed the worker and it never came back. This is why
    # server.mjs exits 1 on an unrecoverable error instead of limping on.
    restart_count: 5
    restart_interval: PT1M
    # No limit. This is a long-running service, not a batch job, and the DEFAULT three-day limit would
    # silently kill it.
    execution_time_limit: PT0S
    # A laptop-class worker must still start and keep running on mains-adjacent power states.
    disallow_start_if_on_batteries: false
    stop_if_going_on_batteries: false
    state: present
    enabled: true

- name: Register the capture-check task
  # Its own task because `utmctl exec` and SSH land in SESSION 0, and guidepup reports that as
  # "NVDA is not supported". The gate needs the same interactive desktop the worker does. Registering it
  # here means every worker can run the gate; it used to be reconstructed by hand each time.
  become: true
  community.windows.win_scheduled_task:
    name: "{{ worker_check_task_name }}"
    description: a11ign capture regression gate (on demand)
    actions:
      - path: "{{ worker_repo_path }}\\packages\\nvda-worker\\src\\run-capture-check.cmd"
    username: "{{ ansible_user }}"
    logon_type: interactive_token
    run_level: limited
    # NO trigger: started on demand, never at logon.
    # 30 minutes rather than unlimited, because unlike the worker this IS a batch job and a wedged check
    # should not sit there forever.
    execution_time_limit: PT30M
    state: present
    enabled: true

- name: Register the display-mode logon task
  # #4441 (part b of #4405): `display.yml` pins the mode ONCE, through a one-shot task that removes itself, so a
  # box that loses the mode afterwards (a driver reset, an update that reboots into the Basic Display Adapter,
  # an RDP session) stayed off the pin until somebody re-provisioned it -- and `displayMode` is a MUST_MATCH
  # field, so that box then refused every capture. This task re-asserts it at every logon. It is ADDED beside
  # the provision-time task, not swapped for it: that one still runs inside the play, where its failure stops
  # the play; this one runs on the box with nobody watching.
  #
  # Its own task, order-independent of `a11ysrv`, so a display write that sticks cannot keep the worker from
  # starting; `execution_time_limit` bounds it for the same reason. It cannot disturb a capture either: at
  # logon none is running yet, and `set-display-mode.ps1` prints `already <w> x <h>` and exits 0 when the mode
  # already equals the pin, which is the ordinary case.
  #
  # The width and height are `worker_display_mode`'s, passed as the environment `display.yml` passes them --
  # never typed here, because `tasks.yml` is exempt from the provision stamp only while every VALUE it applies
  # lives in the hashed `defaults/main.yml`. `logon_type: interactive_token` is the same mechanism and for the
  # same reason as `display.yml`'s one-shot: the display call fails outside the interactive window station, so
  # this attaches to the session the auto-logon established. `run_level: highest` matches that one-shot, the
  # only run level this call has been measured under (#1955).
  #
  # THE EXIT CODE IS THE READ-BACK'S VERDICT, and `exit $LASTEXITCODE` is what carries it out of
  # `powershell.exe -Command`. The script reads the mode back after writing it, in the same process, and exits
  # 1 when the desktop disagrees; without this the task would end 0 whatever the script said. The next
  # "Report what was registered" reads `LastTaskResult` back, so a logon that failed shows as non-zero there.
  become: true
  community.windows.win_scheduled_task:
    name: a11y-display-mode-logon
    description: a11ign display mode, re-asserted and read back at every logon
    actions:
      - path: powershell.exe
        arguments: >-
          -NoProfile -ExecutionPolicy Bypass -Command
          "$env:A11Y_DISPLAY_WIDTH = '{{ worker_display_mode.width }}';
           $env:A11Y_DISPLAY_HEIGHT = '{{ worker_display_mode.height }}';
           & '{{ worker_repo_path }}\packages\worker-fleet\src\provisioning\set-display-mode.ps1';
           exit $LASTEXITCODE"
    username: "{{ ansible_user }}"
    logon_type: interactive_token
    run_level: highest
    triggers:
      - type: logon
        username: "{{ ansible_user }}"
    # A wedged display write must end rather than sit there; the script itself takes seconds.
    execution_time_limit: PT2M
    state: present
    enabled: true

- name: Remove the one-shot bootstrap task if it is still armed
  # `a11ybootstrap` exists only to carry a machine across the reboot that follows account creation. It is
  # deliberately NOT a general update-on-boot mechanism, for three reasons worth keeping:
  #   - workerCode provenance would span two versions inside one corpus run;
  #   - a self-update has no equivalent of the /health.code verification a deploy gets;
  #   - one bad push would brick the whole fleet simultaneously, with no staged rollout anywhere.
  become: true
  community.windows.win_scheduled_task:
    name: a11ybootstrap
    state: absent

- name: Report what was registered
  # Read BACK, not assumed. `Register-ScheduledTask` returning cleanly means the request was accepted;
  # this is the same distinction that made `utmctl exec` untrustworthy for an hour.
  become: true
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      foreach ($n in @('{{ worker_task_name }}', '{{ worker_check_task_name }}', 'a11y-display-mode-logon')) {
        $t = Get-ScheduledTask -TaskName $n -ErrorAction SilentlyContinue
        if ($t) {
          # `lastResult` is what the task's last run exited with: the display-mode logon task ends non-zero
          # when its read-back disagreed with the pin, and 267011 (0x41303) means it has not run yet.
          "$n logon=$($t.Principal.LogonType) runLevel=$($t.Principal.RunLevel) " +
          "triggers=$(($t.Triggers | Measure-Object).Count) restarts=$($t.Settings.RestartCount) " +
          "lastResult=$((Get-ScheduledTaskInfo -TaskName $n).LastTaskResult)"
        } else { "$n MISSING" }
      }
  register: registered_tasks
  changed_when: false

- name: Say so
  ansible.builtin.debug:
    var: registered_tasks.output
