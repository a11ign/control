---
# PATCH THE FLEET ON PURPOSE: every box, the same quality updates, now, then back to deferred -- #4445, under #4405.
#
#     ansible-playbook patch.yml                       # the window: each box in turn
#     ansible-playbook patch.yml --limit a11y-worker-4 # one box (a re-run after a refusal)
#
# ## Why this exists
#
# #4438 defers quality updates 30 days (`worker_update_deferral_policy`), so no box moves its Windows build
# on its own. That makes the build a thing the fleet DOES rather than a thing that happens, and this is the
# doing: lift the deferral, install what is pending, reboot, put the deferral back, and read the build off
# every box so the play ends by NAMING them. The OS build is a capture-cache key (`environmentKey()`), so
# "the fleet is on one build" is the claim the whole play exists to prove, not to assume.
#
# ## ONE BOX AT A TIME, and a refusal HALTS the rest
#
# `serial: 1` keeps nine boxes capture-capable while one is down for its reboot. It is also what makes a
# refusal stop the rollout: a batch of one that fails is a fully failed batch, so the play ends instead of
# patching nine boxes around the one that refused (`busy-worker-guard.test.ts` pins the same reasoning for
# `provision.yml`). `any_errors_fatal` says it outright too. Re-run with `--limit` for the boxes that are left.
#
# ## The deferral is restored in an `always`, and that is the safety property
#
# Between "lift" and "restore" the box can install ANY quality update Windows Update offers. A play that
# died in the install and left the deferral at 0 would give every later reboot of that box a free choice of
# build, which is the drift #4438 removed. So the restore sits in `always:` -- it runs when the install or
# the reboot failed -- and is read back.
#
# ## It reboots only a box that INSTALLED something
#
# `reboot: false` on `win_updates`, always: the reboot is this play's own `win_reboot`, visible as a task, and
# it fires only when updates were installed AND Windows asks for it. A pending reboot left by something else
# is reported and left alone; rebooting a box that installed nothing is a restart nobody asked for, on a
# machine that may be holding a capture.
#
# ## A box BELOW the fleet's target build is brought up to it, a feature update included -- #4897, under #4405
#
# The categories above carry cumulative updates only, and feature deferral stays at 365 days, so a 22631 box
# could never reach 26100 or 26200 here (#4894 read 14 boxes below the target). The chairman's amendment
# (a11ign#4795) is "a box below the target is patched, never excluded". So the play takes a TARGET, and only
# when one is given:
#
#     ansible-playbook patch.yml -e patch_target_release=25H2 -e patch_target_build=26200.9457
#
#   - `patch_target_release` is the release NAME (`TargetReleaseVersionInfo`), `patch_target_build` the
#     `<CurrentBuild>.<UBR>` the boxes must reach. Both are read from the fleet by the CALLER and never written
#     into this file: the fleet's target moves with its cumulative update. Both empty (the default) is the
#     play exactly as it was: same categories, same deferral, same reboot rule.
#   - Lifted for the window: the feature deferral (days to 0, the same lift the quality deferral gets),
#     `TargetReleaseVersion` = 1, `TargetReleaseVersionInfo`, and `ProductVersion` (`Windows 11`, which the
#     policy writes with the other two); `Upgrades` joins the categories.
#   - Put back in the `always`: the role's whole list, AND the target values REMOVED, because "as provisioned"
#     has none. The removal runs on every run, target or not: a target left by a process that was killed
#     (an `always` cannot run then) would otherwise stay a standing lever for a feature update, which is
#     the drift #921 closed, and the next window of any kind heals it.
#   - The reboot is unchanged and still this play's own `win_reboot`, conditional on an install that asked for
#     one: a box already on the target is offered no `Upgrades`, so it installs nothing and is not restarted.
#   - The last task of the box fails it, by worker number, when its build is below the target or cannot be read.
#     A window that moved nothing must not read as success (#4733). A box that needed a second pass (the new
#     build's own cumulative) fails here and is re-run with `--limit`; `any_errors_fatal` halts the rest.
#
# ## A feature update must be SWITCHED, not just staged -- a11ign#4979, under #4405
#
# Worker 6 staged 25H2 to the end (`$WINDOWS.~BT` built, Setup's `DelayedSwitch: 1`, `win_updates` Succeeded with
# RebootRequired) and three plain restarts came back on the same build: the switch was never committed. So a pass
# that installed an `Upgrades` item and asked for a restart (`patch_switch_pending`; any other pass is untouched):
#
#   1. runs `UsoClient.exe StartInstall`, the Update Orchestrator's own install step, before the restart;
#   2. reads `bcdedit /enum all` and waits up to three minutes for a SafeOS entry;
#   3. FAILS the box, by worker number, `staged but not switched`, with the entries, and never restarts it.
#
# The restart stays this play's own `win_reboot`. Whether step 1 is what commits the switch is the live window's
# to say: if the box still has no entry, that is the next row (the installer from the staged media), not this one.
#
# ## Not read here
#
# That `win_updates` works on this fleet's Windows edition has not been read: the first run is row E's, with
# `--check --limit <one idle box>` first. Neither has the `Upgrades` path: that the feature update installs
# through `win_updates`, that `ProductVersion` is honoured beside the two named values, and how long a
# feature update's reboot takes on these boxes (the timeout below is a guess, longer than the cumulative's).

- name: The workers must be in the inventory
  # A run that matches no host prints "skipping: no hosts matched" and EXITS 0, so a patch window could "pass"
  # having patched nothing and named no build. Settled on localhost, where the refusal can speak.
  hosts: localhost
  gather_facts: false
  tasks:
    - name: The workers must be in the inventory
      ansible.builtin.include_tasks: tasks/require-inventory-group.yml
      vars:
        inventory_group: a11y_workers
        inventory_group_noun: worker

- name: Install the pending quality updates on every worker, one box at a time
  hosts: a11y_workers
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  # The role's OWN list, never a copy: what this play restores is exactly what `provision.yml` applies, so
  # the two cannot disagree about what "deferred" means. `vars_files` outranks `group_vars`, and nothing
  # overrides this variable there; an override would have to be made in the role defaults.
  vars_files:
    - roles/worker/defaults/main.yml
  vars:
    # The target, supplied by the caller (`-e`, which outranks this). Empty means no target: the play is
    # then what it was before #4897, and nothing below changes a value, a category or a rule.
    patch_target_release: ''
    patch_target_build: ''
    patch_target_set: "{{ (patch_target_release | string | length) > 0 }}"
    # The deferral entries the window lifts, by NAME out of the role's list: the quality one always, the
    # feature one only with a target, so feature deferral stays exactly as provisioned otherwise.
    patch_lifted_names: >-
      {{ ['DeferQualityUpdatesPeriodInDays']
         + (['DeferFeatureUpdatesPeriodInDays'] if patch_target_set | bool else []) }}
    patch_lifted_values: >-
      {{ worker_update_deferral_policy
         | selectattr('name', 'in', patch_lifted_names)
         | map('combine', {'value': 0}) | list }}
    # Written for the window only and REMOVED afterwards (the role provisions none). Same key as the deferral.
    patch_policy_path: "{{ (worker_update_deferral_policy | first).path }}"
    patch_target_names: [TargetReleaseVersion, TargetReleaseVersionInfo, ProductVersion]
    patch_target_values: >-
      {{ [{'path': patch_policy_path, 'name': 'TargetReleaseVersion', 'value': 1, 'type': 'dword'},
          {'path': patch_policy_path, 'name': 'TargetReleaseVersionInfo', 'value': patch_target_release, 'type': 'string'},
          {'path': patch_policy_path, 'name': 'ProductVersion', 'value': 'Windows 11', 'type': 'string'}]
         if patch_target_set | bool else [] }}
    patch_window_values: "{{ patch_lifted_values + patch_target_values }}"
    patch_base_categories: [SecurityUpdates, CriticalUpdates, UpdateRollups, Updates]
    patch_categories: "{{ patch_base_categories + (['Upgrades'] if patch_target_set | bool else []) }}"
    # True only for a pass whose install actually installed an `Upgrades` item and asked for a restart: the
    # one pass whose restart must be a SWITCH (a11ign#4979). Everything else is the play as it was.
    patch_switch_pending: >-
      {{ (patch_updates.reboot_required | default(false) | bool)
         and (patch_updates.updates | default({}) is mapping)
         and ((patch_updates.updates | default({}) | dict2items
               | selectattr('value.installed', 'defined') | selectattr('value.installed')
               | selectattr('value.categories', 'defined')
               | map(attribute='value.categories') | flatten
               | select('equalto', 'Upgrades') | list | length) > 0) }}
    # What a committed switch leaves in the BCD: Setup's "Add safe OS boot entry" writes a WinPE entry whose
    # device is the staged media under `$WINDOWS.~BT`. Taken from Setup's own log text and the shape of a
    # WinPE entry, NOT yet read off a box that committed one (the live window is the VERIFY row), so the
    # three alternatives are deliberately broad and the evidence is printed whole when none matches.
    patch_safeos_pattern: '\$WINDOWS\.~BT|SafeOS|winpe\s+Yes'
  tasks:
    - name: The deferrals to lift are declared and the target is given whole, or the window would do nothing
      # A lift that matches no entry "succeeds" and installs nothing -- a green result vouching for an inert
      # remedy. Exactly one entry per name. And a release with no build could never be checked at the end,
      # a build with no release would change nothing: either is a window that reads as patched. The shapes
      # are checked because both land in the registry and in a comparison. One task, so that nothing
      # sits between the guard and the busy check below.
      tags: [patch_target_inputs]
      ansible.builtin.assert:
        that:
          - patch_lifted_values | length == patch_lifted_names | length
          - (patch_target_release | string | length > 0) == (patch_target_build | string | length > 0)
          - not (patch_target_set | bool) or (patch_target_release | string) is match('^[0-9]{2}H[12]$')
          - not (patch_target_set | bool) or (patch_target_build | string) is match('^[0-9]+\.[0-9]+$')
        fail_msg: >-
          Either worker_update_deferral_policy has no entry (or more than one) for each of {{ patch_lifted_names }},
          so there is no deferral for the patch window to lift; or patch_target_release
          ('{{ patch_target_release }}') and patch_target_build ('{{ patch_target_build }}') are not given
          together, as a release like 25H2 and a build like 26200.9457, or not at all.

    - name: Refuse to patch a worker that is mid-capture
      # Same shape and same reason as display.yml's and edge-version.yml's check: an install that ends in a
      # reboot destroys 12-520 s of real screen-reader work. `busy` is the field; `ok` only ever meant "the
      # HTTP server is answering". Unanswered counts as busy.
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ a11y_port }}/health"
        return_content: true
      register: patch_worker_health
      failed_when: patch_worker_health.json.busy | default(true)

    - name: Lift the deferral, install, reboot if it installed something -- and always put the deferral back
      block:
        - name: Quality updates may install now
          become: true
          ansible.windows.win_regedit:
            path: "{{ item.path }}"
            name: "{{ item.name }}"
            data: "{{ item.value }}"
            type: "{{ item.type | default('dword') }}"
          loop: "{{ patch_window_values }}"
          loop_control:
            label: "{{ item.name }} = {{ item.value }}"

        - name: Refuse to install unless the lift landed
          # Read back, because an install under a deferral that is still in force finds nothing and reports
          # success. Not under `--check`: the write above did not happen there, so the read would fail on a
          # dry run for the right reason and teach nobody anything.
          when: not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            parameters:
              Wanted: "{{ patch_window_values }}"
            script: &read_back_deferral |
              param($Wanted)
              $Ansible.Changed = $false
              $wrong = @()
              foreach ($v in $Wanted) {
                $cur = $null
                try { $cur = (Get-ItemProperty -LiteralPath $v.path -Name $v.name -ErrorAction Stop).($v.name) } catch { $cur = $null }
                if ($null -eq $cur -or "$cur" -ne "$($v.value)") { $wrong += "$($v.path)\$($v.name) is '$cur', wanted '$($v.value)'" }
              }
              if ($wrong.Count -gt 0) { $Ansible.Failed = $true; "deferral did not read back: " + ($wrong -join '; ') }
              else { "$($Wanted.Count) deferral value(s) read back" }

        - name: Install the pending quality updates, WITHOUT letting the module reboot
          # `reboot: false` is load-bearing: the reboot below is this play's own, visible and conditional.
          become: true
          ansible.windows.win_updates:
            category_names: "{{ patch_categories }}"
            state: installed
            reboot: false
            log_path: 'C:\Windows\Temp\a11y-patch-updates.log'
          register: patch_updates

        - name: Say what was installed
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: found {{ patch_updates.found_update_count | default(0) }},
              installed {{ patch_updates.installed_update_count | default(0) }},
              failed {{ patch_updates.failed_update_count | default(0) }},
              reboot {{ 'required' if patch_updates.reboot_required | default(false) else 'not required' }}

        - name: Commit the staged feature update's switch through the Update Orchestrator
          # a11ign#4979: the module reported `Succeeded, RebootRequired` with the media built and Setup's
          # `DelayedSwitch: 1` serialised, and three plain `shutdown.exe` restarts came back on the same build
          # because nothing had committed the switch. Hypothesis (NOT established): a feature update wants the
          # Update Orchestrator's own install step before the restart. `UsoClient.exe StartInstall` is that
          # step; it is asynchronous and silent, and not Microsoft-documented (third-party guides list it), so
          # the BCD read below is what says whether it worked. Only a pass that installed an `Upgrades` item
          # runs it.
          when:
            - not ansible_check_mode
            - patch_switch_pending | bool
          become: true
          ansible.windows.win_shell: UsoClient.exe StartInstall
          register: patch_switch_commit

        - name: Read the BCD, waiting for the staged switch to appear
          # `until`, because StartInstall returns before it has written anything. `failed_when: false`: the
          # verdict is the next task's, which names the box and prints the entries.
          when:
            - not ansible_check_mode
            - patch_switch_pending | bool
          become: true
          ansible.windows.win_powershell:
            script: |
              $Ansible.Changed = $false
              bcdedit /enum all
          register: patch_bcd
          changed_when: false
          failed_when: false
          until: (patch_bcd.output | default([]) | join('\n')) is search(patch_safeos_pattern, ignorecase=true)
          retries: 18
          delay: 10

        - name: A feature update staged but not switched fails the box, before any restart
          # The restart below would otherwise come back on the same build and the pass would read as
          # `installed`. Failing HERE sends the run through the `always` (deferral and target put back)
          # and halts the rest (`any_errors_fatal`).
          tags: [patch_switch_verdict]
          when:
            - not ansible_check_mode
            - patch_switch_pending | bool
            - not ((patch_bcd.output | default([]) | join('\n')) is search(patch_safeos_pattern, ignorecase=true))
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: staged but not switched. The feature update was installed to the end
              of staging and Windows asked for a restart, but the BCD has no SafeOS entry, so a restart would
              come back on the same build. BCD entries: {{ patch_bcd.output | default([]) | map('trim') | reject('equalto', '') | join(' | ') }}

        - name: Reboot, only because updates were installed and Windows asked
          when:
            - patch_updates.installed_update_count | default(0) | int > 0
            - patch_updates.reboot_required | default(false)
          become: true
          ansible.windows.win_reboot:
            # A feature update's servicing reboots run longer than a cumulative's; only a target lengthens it.
            reboot_timeout: "{{ 7200 if patch_target_set | bool else 1800 }}"

        - name: Wait for the worker to be READY again
          # `ready`, not `ok` -- see the busy check above. Only after a reboot we made.
          when:
            - patch_updates.installed_update_count | default(0) | int > 0
            - patch_updates.reboot_required | default(false)
          delegate_to: localhost
          become: false
          ansible.builtin.uri:
            url: "http://{{ ansible_host }}:{{ a11y_port }}/health"
            return_content: true
          register: patch_health_after
          until: patch_health_after.status is defined and patch_health_after.status == 200 and (patch_health_after.json.ready | default(false))
          retries: 90
          delay: 10

        - name: Say so when a pending reboot was left alone
          when:
            - patch_updates.installed_update_count | default(0) | int == 0
            - patch_updates.reboot_required | default(false)
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} has a reboot pending that THIS run did not cause (nothing was
              installed), so it was not rebooted. It restarts on its own schedule.

      always:
        - name: Defer quality updates again, from the role's own values
          become: true
          ansible.windows.win_regedit:
            path: "{{ item.path }}"
            name: "{{ item.name }}"
            data: "{{ item.value }}"
            type: dword
          loop: "{{ worker_update_deferral_policy }}"
          loop_control:
            label: "{{ item.name }} = {{ item.value }}"

        - name: Refuse to call the box patched unless the deferral is back
          when: not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            parameters:
              Wanted: "{{ worker_update_deferral_policy }}"
            script: *read_back_deferral

        - name: Remove the target release, which the role does not provision
          # On every run, not only a targeted one: see the header. An absent value is already as wanted.
          become: true
          ansible.windows.win_regedit:
            path: "{{ patch_policy_path }}"
            name: "{{ item }}"
            state: absent
          loop: "{{ patch_target_names }}"

        - name: Refuse to call the box patched while a target release is still set
          when: not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            parameters:
              Path: "{{ patch_policy_path }}"
              Names: "{{ patch_target_names }}"
            script: |
              param($Path, $Names)
              $Ansible.Changed = $false
              $left = @()
              foreach ($n in $Names) {
                $cur = (Get-ItemProperty -LiteralPath $Path -Name $n -ErrorAction SilentlyContinue).$n
                if ($null -ne $cur) { $left += "$n = '$cur'" }
              }
              if ($left.Count -gt 0) { $Ansible.Failed = $true; "target release still set: " + ($left -join '; ') }
              else { "$($Names.Count) target release value(s) absent" }

    - name: Ask the box what Windows build it is on now
      # `CurrentBuild.UBR` is the whole build; `CurrentBuild` alone is the same for every monthly update.
      # A box that cannot be asked is `unreadable` below, which is a different fact from a build that differs.
      become: true
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $v = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($v.CurrentBuild).$($v.UBR)"
      changed_when: false
      failed_when: false
      # A read, so it runs under `--check` too: a dry run that cannot see the build cannot name it.
      check_mode: false
      register: patch_build_read

    - name: Record the build, or that it could not be read
      ansible.builtin.set_fact:
        patch_build_reading: >-
          {{ (patch_build_read.output | default([]) | first | default('', true) | trim)
             if (patch_build_read.failed is not defined or not patch_build_read.failed)
                and (patch_build_read.output | default([]) | first | default('', true) | trim) is match('^[0-9]+\.[0-9]+$')
             else 'unreadable' }}

    - name: Name the build
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ patch_build_reading }}"

    - name: A box below the target build, or one that cannot be read, is a failed window
      # Last on purpose: everything above ran, so this is the box's own reading after the run. Numbers
      # compare as `[build, UBR]`, never as text ('9457' sorts above '10000'). Unreadable fails here although
      # the verdict play does not count it a mismatch: that play judges agreement, this one a promise to
      # reach a build, and a box nobody could read has not been shown to have reached it.
      tags: [patch_target_verdict]
      when:
        - patch_target_set | bool
        - >-
          patch_build_reading | default('unreadable', true) == 'unreadable'
          or (patch_build_reading.split('.') | map('int') | list) < (patch_target_build.split('.') | map('int') | list)
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is {{ 'UNREADABLE, so it is not shown to have reached' if
          patch_build_reading | default('unreadable', true) == 'unreadable' else 'on ' ~ patch_build_reading ~ ', below' }}
          the target build {{ patch_target_build }} (release {{ patch_target_release }}). Re-run with
          `--limit {{ inventory_hostname }}`: a box that needed a feature update may need a second pass for the
          new build's own cumulative update.

# The proof (a) asks for: after the window, ONE build. A separate play so it sees every box's reading, and
# tagged so a test can run it alone over a synthetic inventory (`patch-playbook.test.ts`).
- name: The fleet is on one build, or the odd boxes are named
  hosts: a11y_workers
  gather_facts: false
  run_once: true
  tags: [patch_verdict]
  vars:
    patch_readings: >-
      {%- set r = {} -%}
      {%- for h in ansible_play_hosts_all -%}
        {%- set _ = r.update({h: hostvars[h].patch_build_reading | default('unreadable', true)}) -%}
      {%- endfor -%}
      {{ r }}
    patch_read_boxes: "{{ patch_readings | dict2items | rejectattr('value', 'equalto', 'unreadable') | list }}"
    patch_unreadable_boxes: "{{ patch_readings | dict2items | selectattr('value', 'equalto', 'unreadable') | map(attribute='key') | list }}"
    patch_builds: "{{ patch_read_boxes | map(attribute='value') | unique | sort | list }}"
    # The build most boxes share, ties broken by sort order; the boxes NOT on it are the odd ones.
    patch_majority: >-
      {%- set ns = namespace(best='', n=0) -%}
      {%- for b in patch_builds -%}
        {%- set n = patch_read_boxes | selectattr('value', 'equalto', b) | list | length -%}
        {%- if n > ns.n -%}{%- set ns.best = b -%}{%- set ns.n = n -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.best }}
    patch_odd_boxes: "{{ patch_read_boxes | rejectattr('value', 'equalto', patch_majority) | map(attribute='key') | sort | list }}"
  tasks:
    - name: Say every box's build, and which could not be asked
      ansible.builtin.debug:
        msg: >-
          {{ patch_read_boxes | length }} box(es) read, {{ patch_unreadable_boxes | length }} unreadable
          {{ patch_unreadable_boxes }}; builds seen: {{ patch_builds }}.
          {{ 'NO box could be read, so agreement is NOT established.' if patch_read_boxes | length == 0 else '' }}

    - name: Fail when the readable boxes are not all on one build
      # Unreadable boxes are not counted as a mismatch: absence of a reading is "could not determine", not
      # "differs". Only two distinct READ builds fail.
      ansible.builtin.fail:
        msg: >-
          The fleet is on {{ patch_builds | length }} Windows builds: {{ patch_builds }}.
          Odd box(es) (not on {{ patch_majority }}): {{ patch_odd_boxes }}.
          Readings: {{ patch_readings }}.
      when: patch_builds | length > 1
