---
# THE DELIBERATE UPGRADE: every box, to the versions `deploy-pins.json` names, one at a time, then back to frozen -- #4445, under #4405, rewritten by A11-205.
#
#     pnpm run fleet:patch -- --apply                  # the upgrade: `deploy.yml`, then this play, then the whole-fleet read (`src/fleet-upgrade.ts`)
#     ansible-playbook patch.yml                       # this play alone: each box in turn
#     ansible-playbook patch.yml --limit a11y-worker-4 # one box (a re-run after a refusal)
#
# ## Why this exists
#
# Nothing on a box upgrades by itself (A11-205, docs/adr/0001): Windows Update is stopped, not deferred (`roles/worker/tasks/freeze.yml`), and the Edge updater,
# NVDA's update check and the Store are off. So a version moves ONLY here, when a person has edited `deploy-pins.json` in a pull request, merged it, and run
# `fleet:patch -- --apply`. For each box, in turn: lift the Windows levers, bring Windows to the manifest's release and to exactly the manifest's cumulative update,
# restart, install the manifest's Node, NVDA and Edge (and the display driver pin), put the freeze back in an `always:`, and read the box back against the
# manifest. The play then ends by reading EVERY box. There is no schedule: the 28-day patch window is gone.
#
# THE TARGET IS THE MANIFEST'S AND NOTHING ELSE'S. It used to be "the newest build any box reports", so a box that updated itself set the target for the
# fleet. Now `patch_target_release`, `patch_target_build` and `patch_target_kb` are derived from `deploy-pins.json` and the first task refuses a run in which any
# of them was given another value with `-e`. A box ABOVE the manifest is refused by name before anything is lifted and is NEVER rolled back: the manifest is
# edited to catch up with it, or a person decides what becomes of that box.
#
# ## ONE BOX AT A TIME, and a refusal HALTS the rest
#
# `serial: 1` keeps nine boxes capture-capable while one is down for its reboot. It is also what makes a
# refusal stop the rollout: a batch of one that fails is a fully failed batch, so the play ends instead of
# patching nine boxes around the one that refused (`busy-worker-guard.test.ts` pins the same reasoning for
# `provision.yml`). `any_errors_fatal` says it outright too. Re-run with `--limit` for the boxes that are left.
#
# ## The freeze is restored in an `always`, and that is the safety property
#
# Between "lift" and "re-freeze" the box can install ANY update Windows Update offers. A play that died in the install and left the levers lifted would give
# every later reboot of that box a free choice of build, which is the drift this ticket ends. So the re-freeze sits in `always:` -- it runs when the install or
# the reboot failed -- and is read back by the role's own freeze, which fails the box by name if a lever did not hold. The lift is the role's too
# (`worker_freeze_lift_windows`): it drops only the levers that stop Windows Update being ASKED (the server redirect, `NoAutoUpdate`, two services' start types),
# so one task list says what "frozen" is and what "lifted" is, and a lift that did not land fails before anything installs.
#
# ## It reboots only a box that INSTALLED something
#
# `reboot: false` on `win_updates`, always: the reboot is this play's own `win_reboot`, visible as a task, and
# it fires only when updates were installed AND Windows asks for it, or for a feature pass, whose one restart is
# the commit (below). A pending reboot left by something else
# is reported and left alone; rebooting a box that installed nothing is a restart nobody asked for, on a
# machine that may be holding a capture.
#
# ## A box BELOW the manifest's build is brought up to it, a feature update included -- #4897, under #4405, from the manifest by A11-205
#
# The categories below carry cumulative updates only, so a 22631 box could never reach 26300 here (#4894 read 14 boxes below the target). The chairman's
# amendment (a11ign#4795) is "a box below the target is patched, never excluded". The target is the manifest's `windows` section:
#
#   - `release` is the release NAME (`TargetReleaseVersionInfo`), `build` the `<CurrentBuild>.<UBR>` the boxes must reach, and `kb` the cumulative update that
#     produces it. `win_updates` is given that KB as its `accept_list`, so a run lands on the manifest's build and not on whatever Microsoft published after
#     the manifest was edited; a box that lands above it could not be moved back.
#   - The lift is the role's (`worker_freeze_lift_windows`). `TargetReleaseVersion`, `TargetReleaseVersionInfo` and `ProductVersion` are part of the freeze and
#     stand at the manifest's `windows.release`, so the Installation Assistant is never steered off the manifest. The target does NOT steer the Assistant:
#     asked for 25H2, worker 6 went to 26H2 (build 26300), the build the Assistant offers.
#   - A box already ON the manifest's build has its Windows work skipped and still has Node, NVDA, Edge and the display driver checked against the manifest.
#   - Put back in the `always`: the whole freeze, the lifted levers included.
#   - The last task of the box fails it, by worker number, when its build is not the manifest's or cannot be read. A window that moved nothing must not read as
#     success (#4733). A box that needed a second pass (the new build's own cumulative) fails here and is re-run with `--limit`; `any_errors_fatal` halts the rest.
#
# ## A feature update goes through Microsoft's Windows 11 Installation Assistant -- A11-31, under #4405
#
# `win_updates` cannot move a box across a release. With the `Upgrades` category it marks the feature update
# "installed" in about twenty seconds without Setup ever running, and a restart after that comes back on the
# same build (worker 6, a11ign#4979 and #5052: `$WINDOWS.~BT` built, Setup's `DelayedSwitch` serialised, three
# restarts, nothing switched). `Setup /PreDownload` stages the same plan and nothing executes it unless Setup
# runs to its last phase and the box is then restarted. Nor did `UsoClient.exe StartInstall` commit it (the BCD
# never held a SafeOS entry). Those steps, and the BCD wait and the `staged but not switched` refusal built on
# them, are gone.
#
# What committed the switch, on 11 boxes (workers 2, 3, 4, 7, 8, 9, 10, 12, 13, 15, 16; A11-31; worker 6 went the
# same way but was restarted by a different step):
#
#   1. a box whose `CurrentBuild` is below the target's has the Assistant fetched from Microsoft
#      (`patch_feature_installer_url`), its Authenticode signature checked as valid and Microsoft's, and is run
#      DETACHED (`Win32_Process.Create`) with `/QuietInstall /SkipEULA /Auto Upgrade`, so the SSH session is
#      not what Setup lives or dies with;
#   2. the play waits for Setup to finish: `SetupPhasePostFinalize` in `$WINDOWS.~BT\Sources\Panther\setupact.log`,
#      written AFTER the launch. The Assistant never restarts the box ("Rebooting system... prevented by
#      command line override"), so Setup then sits there until something does. The wait took 1 h 38 min with
#      ten boxes running at once;
#   3. ONE `win_reboot`, this play's own, commits it. The box comes back on the new build.
#
# A pass that does this does nothing else: the Assistant lands the box on the release's current build, and the
# closing task fails a box that is still below the target, to be re-run with `--limit` for the cumulative.
#
# Not read, said plainly. (a) A `win_reboot` after the 1 h 38 min wait hung on ten boxes for over two hours
# while the boxes were back and ready. A reused SSH connection that did not survive the restart is the suspect
# (`ansible.cfg` warns of exactly that) and is NOT proven; `meta: reset_connection` before the restart and a
# `timeout:` on the restart task are the guard against it either way. (b) `patch_feature_min_free_gb` is a floor
# this fleet chose, not a Microsoft figure; the ten boxes rolled together held 72 GB or more.

- name: The workers must be in the inventory
  # A run that matches no host prints "skipping: no hosts matched" and EXITS 0, so an upgrade could "pass"
  # having patched nothing and named no build. Settled on localhost, where the refusal can speak.
  hosts: localhost
  gather_facts: false
  tasks:
    - name: The workers must be in the inventory
      ansible.builtin.include_tasks: tasks/require-inventory-group.yml
      vars:
        inventory_group: a11y_workers
        inventory_group_noun: worker

- name: The daily freeze must not be running underneath this upgrade
  # The freeze puts the Windows levers back on every reachable box. Fired between a box's lift and its install it would undo the lift mid-run, and the install
  # would find a redirect it was told to drop. Its own unit refuses to start while this play runs (`files/a11y-fleet-freeze-daily.service`); this is the other half.
  # On the control plane, where this runs: the workers play, run once and delegated to it, because `hosts: localhost` matches nothing there ("skipping: no hosts matched").
  hosts: a11y_workers
  gather_facts: false
  run_once: true
  tasks:
    - name: Ask systemd whether the daily freeze is running
      delegate_to: localhost
      ansible.builtin.command:
        argv: [systemctl, show, --property=ActiveState, --value, a11y-fleet-freeze-daily.service]
      register: patch_daily_freeze
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse while it is
      delegate_to: localhost
      ansible.builtin.assert:
        that: (patch_daily_freeze.stdout | trim) not in ['active', 'activating', 'deactivating', 'reloading']
        fail_msg: >-
          `a11y-fleet-freeze-daily.service` is {{ patch_daily_freeze.stdout | trim }}: it is putting the freeze back on every box, and would undo this
          upgrade's lift. Nothing has been changed. Wait for it (`systemctl status a11y-fleet-freeze-daily.service`) and run this again.

- name: Install the pending quality updates on every worker, one box at a time
  hosts: a11y_workers
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    # The fleet's one manifest (A11-205), one directory up from the playbooks, as the role reads it.
    patch_manifest: "{{ lookup('file', playbook_dir ~ '/../deploy-pins.json') | from_json }}"
    # THE TARGET, from the manifest and from nowhere else. These stay variables so the tasks below read one name; the first task refuses a run in which a caller's `-e`
    # (which outranks this) gave any of them another value.
    patch_target_release: "{{ patch_manifest.windows.release }}"
    patch_target_build: "{{ patch_manifest.windows.build }}"
    patch_target_kb: "{{ patch_manifest.windows.kb }}"
    # Cumulative updates only: `Upgrades` is not a category here. `win_updates` marks a feature update installed
    # without running Setup (see the header), so the feature update has its own route below.
    patch_categories: [SecurityUpdates, CriticalUpdates, UpdateRollups, Updates]
    # The box's `<CurrentBuild>.<UBR>` before the upgrade changes anything, set by a task below; `unreadable` until then (and a box that stays so is refused).
    patch_build_before: unreadable
    # True for a pass on a box whose `CurrentBuild` is BELOW the target's: the one pass that runs the Installation
    # Assistant and restarts once Setup has finished. A box on the target's `CurrentBuild` (any UBR) is never sent
    # to it: a lower UBR is a cumulative's.
    patch_feature_pending: >-
      {{ ((patch_build_before | string) is match('^[0-9]+\.[0-9]+$'))
         and ((((patch_build_before | string).split('.') | first) | int)
              < (((patch_target_build | string).split('.') | first) | int)) }}
    # True when the box already stands on the manifest's build: its Windows work is skipped, and the rest of the upgrade still checks it.
    patch_windows_current: "{{ (patch_build_before | string) == (patch_target_build | string) }}"
    # Microsoft's Windows 11 Installation Assistant, the fwlink Microsoft publishes for it. The Authenticode check
    # below refuses anything that is not validly signed by Microsoft Corporation.
    patch_feature_installer_url: 'https://go.microsoft.com/fwlink/?linkid=2171764'
    patch_feature_workdir: 'C:\Windows\Temp\a11y-feature-update'
    # `/QuietInstall /SkipEULA /Auto Upgrade` is the unattended upgrade; the Assistant restarts nothing by itself.
    patch_feature_installer_args: '/QuietInstall /SkipEULA /Auto Upgrade'
    # Free space on C: below which the Assistant is not started. A floor this fleet chose, not Microsoft's figure.
    patch_feature_min_free_gb: 40
    # Setup is waited for once a minute, up to this many times: 1 h 38 min was measured, 3 h is the limit.
    patch_feature_wait_retries: 180
    patch_feature_wait_delay: 60
    # The one restart: the feature pass's commit, or a cumulative's. Only a feature pass lengthens it, and the
    # task's own `timeout` is a bound on a hang the module's `reboot_timeout` did not bound (see the header).
    patch_reboot_timeout: "{{ 3600 if patch_feature_pending | bool else 1800 }}"
    patch_restart_wanted: >-
      {{ (patch_feature_pending | bool)
         or ((patch_updates.installed_update_count | default(0) | int) > 0
             and (patch_updates.reboot_required | default(false) | bool)) }}
  tasks:
    - name: The target is the manifest's, whoever said otherwise
      # Extra vars outrank the play's own, so `-e patch_target_build=...` would move the target off the manifest. The manifest is read here a second time, directly, and
      # the three must equal it: a target that does not come from `deploy-pins.json` is the converge-forward drift this ticket ends. The shapes are checked too, because
      # all three land in a comparison or in `accept_list`.
      tags: [patch_target_inputs]
      ansible.builtin.assert:
        that:
          - patch_target_release == (lookup('file', playbook_dir ~ '/../deploy-pins.json') | from_json).windows.release
          - patch_target_build == (lookup('file', playbook_dir ~ '/../deploy-pins.json') | from_json).windows.build
          - patch_target_kb == (lookup('file', playbook_dir ~ '/../deploy-pins.json') | from_json).windows.kb
          - (patch_target_release | string) is match('^[0-9]{2}H[12]$')
          - (patch_target_build | string) is match('^[0-9]+\.[0-9]+$')
          - (patch_target_kb | string) is match('^KB[0-9]{6,8}$')
        fail_msg: >-
          The upgrade's target (release '{{ patch_target_release }}', build '{{ patch_target_build }}', update '{{ patch_target_kb }}') is not what `deploy-pins.json` pins
          for Windows, or is not shaped as a release, a <CurrentBuild>.<UBR> build and a KB. The target comes from the manifest only: edit it in a pull request.

    - name: Refuse to patch a worker that is mid-capture
      # Same shape and same reason as display.yml's and edge-version.yml's check: an install that ends in a
      # reboot destroys 12-520 s of real screen-reader work. `busy` is the field; `ok` only ever meant "the
      # HTTP server is answering". Unanswered counts as busy.
      delegate_to: localhost
      become: false
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ a11y_port }}/health"
        return_content: true
      register: patch_worker_health
      failed_when: patch_worker_health.json.busy | default(true)

    - name: Read the build before anything is lifted or installed
      # The feature route is chosen on this, and a box ABOVE the manifest is refused on it, so it is read once, from the registry, before the block lifts anything, as the
      # closing task reads it. A read, so it runs under `--check` too. Unreadable leaves `patch_build_before` as `unreadable`, and that box is refused below.
      become: true
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $v = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($v.CurrentBuild).$($v.UBR)"
      changed_when: false
      failed_when: false
      check_mode: false
      register: patch_build_before_read

    - name: Record the build before, or that it could not be read
      ansible.builtin.set_fact:
        patch_build_before: >-
          {{ (patch_build_before_read.output | default([]) | first | default('', true) | trim)
             if (patch_build_before_read.failed is not defined or not patch_build_before_read.failed)
                and (patch_build_before_read.output | default([]) | first | default('', true) | trim) is match('^[0-9]+\.[0-9]+$')
             else 'unreadable' }}

    - name: A box above the manifest, or one that cannot be read, is refused by name and nothing is lifted
      # NEVER ROLLED BACK. The standing rule is never back to an older build, and the manifest is the only thing that says which build the fleet is on:
      # a box above it stops the run, and a person edits the manifest to catch up with it or decides what becomes of the box. Numbers compare as `[build, UBR]`, never as text
      # ('9457' sorts above '10000'). An unreadable box has not been shown to be at or below the manifest, so it is refused too. Before the block, so a refusal leaves the box frozen.
      tags: [patch_above_manifest]
      ansible.builtin.assert:
        that:
          - patch_build_before != 'unreadable'
          - (patch_build_before.split('.') | map('int') | list) <= (patch_target_build.split('.') | map('int') | list)
        fail_msg: >-
          {{ inventory_hostname }} {{ 'build could not be read, so it is not shown to be at or below' if patch_build_before == 'unreadable'
          else 'is on ' ~ patch_build_before ~ ', ABOVE' }} the manifest's build {{ patch_target_build }} (`deploy-pins.json`). It is not rolled back, and the upgrade stops
          here with nothing lifted. Edit the manifest to a build this box is not above, or decide what becomes of the box.

    - name: Lift the Windows levers, install, reboot if it installed something -- and always freeze again
      block:
        - name: Windows Update may be asked to scan and install now, and the lift is read back
          # The role's own freeze with the Windows levers lifted: it reads back the LIFTED state and fails the box by name if a lever did not move, because an install
          # under a redirect that is still in force finds nothing and reports success. Only the levers that stop Windows Update being ASKED are dropped.
          ansible.builtin.include_role:
            name: worker
            tasks_from: freeze.yml
          vars:
            worker_freeze_lift_windows: true

        - name: A feature update needs room for Setup, and a box short of it is refused before anything is fetched
          when:
            - patch_feature_pending | bool
            - not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            parameters:
              MinFreeGb: "{{ patch_feature_min_free_gb }}"
            script: |
              param($MinFreeGb)
              $Ansible.Changed = $false
              $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
              "FREE_GB: $free (needs $MinFreeGb)"
              if ($free -lt [double]$MinFreeGb) { $Ansible.Failed = $true; "less than $MinFreeGb GB free on C:" }

        - name: Fetch the Installation Assistant
          when:
            - patch_feature_pending | bool
            - not ansible_check_mode
          become: true
          block:
            - name: The working directory exists
              ansible.windows.win_file:
                path: "{{ patch_feature_workdir }}"
                state: directory

            - name: Download it from Microsoft
              ansible.windows.win_get_url:
                url: "{{ patch_feature_installer_url }}"
                dest: "{{ patch_feature_workdir }}\\Windows11InstallationAssistant.exe"
                force: true
                timeout: 600

            - name: Refuse anything that is not validly signed by Microsoft Corporation
              ansible.windows.win_powershell:
                parameters:
                  Installer: "{{ patch_feature_workdir }}\\Windows11InstallationAssistant.exe"
                script: |
                  param($Installer)
                  $Ansible.Changed = $false
                  $s = Get-AuthenticodeSignature -LiteralPath $Installer
                  "STATUS: $($s.Status) SIGNER: $($s.SignerCertificate.Subject)"
                  if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
                    $Ansible.Failed = $true; "not validly signed by Microsoft Corporation"
                  }

        - name: Start the Installation Assistant, detached
          # `Win32_Process.Create`, so Setup is a child of WMI and not of this SSH session. `launched.txt` is the
          # clock the wait below holds Setup's log against: a PostFinalize from an earlier attempt must not count.
          when:
            - patch_feature_pending | bool
            - not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            parameters:
              Dir: "{{ patch_feature_workdir }}"
              Arguments: "{{ patch_feature_installer_args }}"
            script: |
              param($Dir, $Arguments)
              # A re-run after the wait below gave up must not start a second Setup beside one still running.
              $running = Get-Process -Name Windows11InstallationAssistant, SetupHost, SetupPrep -ErrorAction SilentlyContinue
              if ($running) { $Ansible.Failed = $true; "Setup is already running: " + (($running | ForEach-Object { $_.ProcessName }) -join ', '); return }
              Remove-Item -LiteralPath "$Dir\exit.txt" -ErrorAction SilentlyContinue
              $cmd = "cmd /c `"`"$Dir\Windows11InstallationAssistant.exe`" $Arguments /copylogs $Dir\logs & echo EXIT %ERRORLEVEL% > $Dir\exit.txt`""
              $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = $cmd; CurrentDirectory = $Dir }
              $at = (Get-Date).ToUniversalTime().ToString('o')
              Set-Content -LiteralPath "$Dir\launched.txt" -Value $at
              "CREATE: ReturnValue=$($r.ReturnValue) at $at"
              if ($r.ReturnValue -ne 0) { $Ansible.Failed = $true; "Win32_Process.Create refused: $($r.ReturnValue)" }

        - name: Wait for Setup to finish, which is SetupPhasePostFinalize written after the launch
          # Not the build: it changes at the restart below, not when Setup is done, so waiting on `windowsBuild`
          # waits for a restart nobody has made (A11-31: that read cost two hours on worker 6).
          when:
            - patch_feature_pending | bool
            - not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            parameters:
              Dir: "{{ patch_feature_workdir }}"
            script: |
              param($Dir)
              $Ansible.Changed = $false
              $launched = [datetime]::Parse((Get-Content -LiteralPath "$Dir\launched.txt")).ToUniversalTime()
              $log = 'C:\$WINDOWS.~BT\Sources\Panther\setupact.log'
              $done = $false
              if (Test-Path -LiteralPath $log) {
                $item = Get-Item -LiteralPath $log
                if ($item.LastWriteTimeUtc -gt $launched) {
                  $done = [bool]((Get-Content -LiteralPath $log -Tail 80) -match 'SetupPhasePostFinalize')
                }
              }
              "SETUP_DONE: $done at $((Get-Date).ToUniversalTime().ToString('HH:mm:ss'))"
          register: patch_setup_wait
          changed_when: false
          until: "'SETUP_DONE: True' in (patch_setup_wait.output | default([]) | join(' '))"
          retries: "{{ patch_feature_wait_retries }}"
          delay: "{{ patch_feature_wait_delay }}"

        - name: Install the manifest's cumulative update, WITHOUT letting the module reboot
          # `reboot: false` is load-bearing: the reboot below is this play's own, visible and conditional.
          # `accept_list` is the manifest's KB, so this installs THAT update and not the newest one Microsoft has published since: a box that landed above the
          # manifest could not be moved back, and every later run would stop on its first box. A box already on the manifest's build installs nothing.
          # Not on a feature pass: the Assistant lands the box on the release's current build, and a restart
          # while Setup is waiting for one is the commit, so nothing is installed beside it.
          when:
            - not (patch_feature_pending | bool)
            - not (patch_windows_current | bool)
          become: true
          ansible.windows.win_updates:
            category_names: "{{ patch_categories }}"
            accept_list: ["{{ patch_target_kb }}"]
            state: installed
            reboot: false
            log_path: 'C:\Windows\Temp\a11y-patch-updates.log'
          register: patch_updates

        - name: Say what was installed
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: found {{ patch_updates.found_update_count | default(0) }},
              installed {{ patch_updates.installed_update_count | default(0) }},
              failed {{ patch_updates.failed_update_count | default(0) }},
              reboot {{ 'required' if patch_updates.reboot_required | default(false) else 'not required' }}

        - name: Name each update that installed, by title and KB, so a feature update is not read as a plain restart
          # a11ign#5308: two passes on worker-12 printed only the counts, so nobody could tell which update the "1" was.
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: installed {{ item.value.title | default('untitled') }} (KB {{ item.value.kb | default(['none']) | join(', ') }})"
          loop: >-
            {{ patch_updates.updates | default({}) | dict2items
               | selectattr('value.installed', 'defined') | selectattr('value.installed') | list }}

        - name: Close the connection a long wait or an install left open, before the restart
          # The restart drops it anyway; a connection that outlives the restart is the suspect for the hang in the
          # header, and a fresh one is cheap. Only where a restart is coming.
          when: patch_restart_wanted | bool
          ansible.builtin.meta: reset_connection

        - name: Reboot, only for the feature update's commit, or because updates were installed and Windows asked
          when: patch_restart_wanted | bool
          become: true
          # `timeout` bounds the whole task. `reboot_timeout` did not: ten boxes sat in this task for over 2 h 10 min
          # with `reboot_timeout: 7200` and the box already back and ready. Why is not known.
          timeout: "{{ (patch_reboot_timeout | int) + 300 }}"
          ansible.windows.win_reboot:
            # A feature update's servicing reboots run longer than a cumulative's; only a feature pass lengthens it.
            reboot_timeout: "{{ patch_reboot_timeout }}"
            msg: "{{ 'A11-31 commit of the feature update' if patch_feature_pending | bool else 'fleet upgrade' }}"

        - name: Wait for the worker to be READY again
          # `ready`, not `ok` -- see the busy check above. Only after a reboot we made.
          when: patch_restart_wanted | bool
          delegate_to: localhost
          become: false
          ansible.builtin.uri:
            url: "http://{{ ansible_host }}:{{ a11y_port }}/health"
            return_content: true
          register: patch_health_after
          until: patch_health_after.status is defined and patch_health_after.status == 200 and (patch_health_after.json.ready | default(false))
          retries: 90
          delay: 10

        - name: Say so when a pending reboot was left alone
          when:
            - patch_updates.installed_update_count | default(0) | int == 0
            - patch_updates.reboot_required | default(false)
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} has a reboot pending that THIS run did not cause (nothing was
              installed), so it was not rebooted. It restarts on its own schedule.

        - name: Defender's security intelligence moves with the upgrade, and a refusal is reported, not fought
          # Signature updates are held by the freeze (policy, `soft`) and arrive through Windows Update, which the lift opens only for this run. Naming the source
          # makes the update explicit. Tamper Protection or a policy that refuses it is SAID and the box carries on: signatures are not a manifest field.
          when: not ansible_check_mode
          become: true
          ansible.windows.win_powershell:
            script: |
              $Ansible.Changed = $false
              try { Update-MpSignature -UpdateSource MicrosoftUpdateServer -ErrorAction Stop; $Ansible.Changed = $true; "SIGNATURES: updated" }
              catch { "SIGNATURES: not updated: $($_.Exception.Message)" }
          register: patch_signatures
          failed_when: false

        - name: Say what Defender did
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }}: {{ patch_signatures.output | default(['(not run)']) | first | default('(no answer)', true) }}"

        # THE REST OF WHAT A BOX RUNS, from the manifest and from the display driver pin, through the role's own task files: one installer for each, the same one
        # `fleet:provision` uses. Each is idempotent and installs only when the box is not already on the pin, so a box that is current pays for a read.
        - name: Node, from the manifest
          ansible.builtin.include_role:
            name: worker
            tasks_from: packages.yml

        - name: NVDA, refused if it is not the manifest's, with its update checks off
          ansible.builtin.include_role:
            name: worker
            tasks_from: nvda.yml

        - name: Edge, from the manifest, with its own re-freeze in an `always:`
          ansible.builtin.include_role:
            name: worker
            tasks_from: edge-version.yml

        - name: The display driver pin
          ansible.builtin.include_role:
            name: worker
            tasks_from: display.yml

      always:
        - name: Freeze the box again, the lifted levers included, and read it back
          # In `always:`, so a run that died in the install or the reboot still leaves the box frozen. A box whose freeze does not read back FAILS HERE, by name,
          # and the play stops (`any_errors_fatal`) rather than patching nine more boxes around one that was left open.
          ansible.builtin.include_role:
            name: worker
            tasks_from: freeze.yml
          vars:
            worker_freeze_lift_windows: false

    - name: Ask the box what Windows build it is on now
      # `CurrentBuild.UBR` is the whole build; `CurrentBuild` alone is the same for every monthly update.
      # A box that cannot be asked is `unreadable` below, which is a different fact from a build that differs.
      become: true
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $v = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($v.CurrentBuild).$($v.UBR)"
      changed_when: false
      failed_when: false
      # A read, so it runs under `--check` too: a dry run that cannot see the build cannot name it.
      check_mode: false
      register: patch_build_read

    - name: Record the build, or that it could not be read
      ansible.builtin.set_fact:
        patch_build_reading: >-
          {{ (patch_build_read.output | default([]) | first | default('', true) | trim)
             if (patch_build_read.failed is not defined or not patch_build_read.failed)
                and (patch_build_read.output | default([]) | first | default('', true) | trim) is match('^[0-9]+\.[0-9]+$')
             else 'unreadable' }}

    - name: Ask the box what Edge and Node it has now
      # From the binaries, as the role reads them (`edge-version.yml`, `packages.yml`): the registry's "installed version" is not what runs.
      become: true
      ansible.windows.win_powershell:
        parameters:
          EdgeExe: "{{ worker_edge_exe }}"
          NodeExe: "{{ worker_node_home }}\\node.exe"
        script: |
          param($EdgeExe, $NodeExe)
          $Ansible.Changed = $false
          $edge = if (Test-Path -LiteralPath $EdgeExe) { (Get-Item -LiteralPath $EdgeExe).VersionInfo.ProductVersion } else { '' }
          $node = if (Test-Path -LiteralPath $NodeExe) { "$(& $NodeExe --version)".Trim() } else { '' }
          [pscustomobject]@{ Edge = "$edge"; Node = "$node" }
      changed_when: false
      failed_when: false
      check_mode: false
      register: patch_versions_read

    - name: Record what this box runs, every field of the manifest it can be compared on
      # NVDA is the role's own reading of `nvda.exe` (`nvda.yml` registered it and refused a version that is not the manifest's). A field that could not be read is
      # `unreadable`, and the verdict play below counts it as a difference: the upgrade ends by SHOWING every box on the manifest.
      ansible.builtin.set_fact:
        patch_readback:
          Windows: "{{ patch_build_reading }}"
          Edge: "{{ (patch_versions_read.output | default([]) | first | default({}, true)).Edge | default('', true) | trim or 'unreadable' }}"
          NVDA: "{{ (nvda_installed.output | default([]) | first | default('', true)) | trim or 'unreadable' }}"
          Node: "{{ (patch_versions_read.output | default([]) | first | default({}, true)).Node | default('', true) | trim or 'unreadable' }}"

    - name: Name what the box runs
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ patch_readback }}"

    - name: A box whose build is not the manifest's, or cannot be read, is a failed upgrade
      # Last on purpose: everything above ran, so this is the box's own reading after the run. Numbers
      # compare as `[build, UBR]`, never as text ('9457' sorts above '10000'). Unreadable fails here although
      # the verdict play does not count it a mismatch: that play judges agreement, this one a promise to
      # reach a build, and a box nobody could read has not been shown to have reached it.
      tags: [patch_target_verdict]
      when:
        - >-
          patch_build_reading | default('unreadable', true) == 'unreadable'
          or (patch_build_reading.split('.') | map('int') | list) != (patch_target_build.split('.') | map('int') | list)
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is {{ 'UNREADABLE, so it is not shown to have reached' if
          patch_build_reading | default('unreadable', true) == 'unreadable' else 'on ' ~ patch_build_reading ~
          (', below' if (patch_build_reading.split('.') | map('int') | list) < (patch_target_build.split('.') | map('int') | list) else ', ABOVE') }}
          the manifest's build {{ patch_target_build }} (release {{ patch_target_release }}). Re-run with
          `--limit {{ inventory_hostname }}`: a box that needed a feature update may need a second pass for the
          new build's own cumulative update. A box above the manifest is not rolled back.

# THE UPGRADE ENDS BY READING EVERY BOX against the whole manifest: Windows build, Edge, NVDA and Node, as each box's own readback recorded them. A separate play so it
# sees every box's reading, and tagged so a test can run it alone over a synthetic inventory (`patch-playbook.test.ts`). The worker code is the wrapper's to read
# (`fleet:drift` over `/health.code`, after this play): the code is the hash of the pinned worker release and is delivered by `deploy.yml`, which `fleet:patch` runs first.
- name: Every box is on the manifest, or the boxes that are not are named
  hosts: a11y_workers
  gather_facts: false
  run_once: true
  tags: [patch_verdict]
  vars:
    patch_verdict_manifest: "{{ lookup('file', playbook_dir ~ '/../deploy-pins.json') | from_json }}"
    # What the manifest wants of each field, in the order the lines are said. The keys are the readback's.
    patch_wants:
      Windows: "{{ patch_verdict_manifest.windows.build }}"
      Edge: "{{ patch_verdict_manifest.edge.version }}"
      NVDA: "{{ patch_verdict_manifest.nvda.version }}"
      Node: "{{ patch_verdict_manifest.node.version }}"
    # One entry per box and field that does not read as the manifest. A box that recorded no readback at all is `unreadable` on every field: the run SHOWS the fleet on
    # the manifest, so a box nobody read has not been shown to be.
    patch_differences: >-
      {%- set found = [] -%}
      {%- for h in ansible_play_hosts_all | sort -%}
        {%- set have = hostvars[h].patch_readback | default({}) -%}
        {%- for field in patch_wants -%}
          {%- if (have[field] | default('unreadable', true)) != patch_wants[field] -%}
            {%- set _ = found.append({'box': h, 'field': field, 'has': have[field] | default('unreadable', true), 'wants': patch_wants[field]}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ found }}
  tasks:
    - name: Say how many boxes were read against the manifest
      ansible.builtin.debug:
        msg: >-
          {{ ansible_play_hosts_all | length }} box(es) read against the manifest ({{ patch_wants }});
          {{ patch_differences | length }} difference(s){{ ': ' ~ (patch_differences | map(attribute='box') | unique | list) if patch_differences | length > 0 else '' }}.

    - name: Fail when any box does not read as the manifest
      ansible.builtin.fail:
        msg: >-
          The fleet is NOT on the manifest after the upgrade: {% for d in patch_differences %}{{ d.box }} {{ d.field }} has {{ d.has }}, the manifest wants {{ d.wants }}{{ '; ' if not loop.last }}{% endfor %}.
          A box that was not upgraded stays named here; fix it and run `fleet:patch -- --apply --limit <box>` again.
      when: patch_differences | length > 0
