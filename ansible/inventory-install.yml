---
# Make the control plane's `inventory.yml` the one fleet definition, and derive this machine's from it.
#
#     npm run fleet:inventory-install
#
# ## Why this is a playbook and not a copy command
#
# The file is untracked and gitignored (#54, the public-repo address exposure), so a pull removes it from
# any checkout holding one. Measured 2026-09-06: the control plane pulled main, the file went, and
# `fleet:deploy` printed `skipping: no hosts matched` and EXITED 0 -- ten workers untouched, the wrapper
# reporting success.
#
# The obvious remedy is to copy the file up by hand. That is precisely what this project has ruled out:
# the operations that matter are CLI-invocable and reviewable, or they are done differently every time by
# whoever is at the keyboard. A one-off `scp` leaves no record of what was placed, no verification that it
# arrived intact, and nothing to run again when the next machine needs it. `ansible/README.md` gives the
# same reason for SSH-over-WinRM and for there being no `/admin/update` route.
#
# ## What it does, and what it deliberately does not
#
# ## THE SOURCE IS THE CONTROL PLANE'S `/etc/a11ign/inventory.yml` (#3239)
#
# Two inventories described one fleet and disagreed about its size: the control plane's named workers 2 to
# 16, the agents host's hand-placed copy 2 to 11, so `fleet:wake` there refused "No worker named
# a11y-worker-12" for a box auto-off on the control plane could power down. There is ONE source now, the
# control plane's installed file (what dispatch, deploy, auto-off and `lab:job` act on, and the copy a pull
# cannot delete). ADDING A WORKER IS ONE EDIT, THERE. This play derives every other host's file from it:
#
# - the control plane HOLDS a copy: it is fetched here and written over the operator's `inventory.yml`
#   (the file `fleet:wake` and `fleet:discover` read when no `/etc/a11ign` copy exists on this machine),
#   after `inventoryDrift` (`control-plane-fleet.mjs`) has said what that file was missing, loudly. A copy
#   AHEAD of the source (a worker only the local file names) STOPS the play: add it on the control plane,
#   or delete the local file, but never let it be overwritten unseen.
# - the control plane holds NONE (the bootstrap this play was written for): the operator's file seeds it.
#
# Either way it then reads the control plane's file back and compares SHA-256 with the operator's, so a
# difference the play did not close is a failure. It does NOT touch the in-tree copy ON THE CONTROL PLANE:
# that is the migration fallback and removing it is a separate decision. Running it twice changes nothing
# the second time.
#
# It does NOT touch the in-tree copy, on either machine. That copy is the migration fallback and removing
# it is a separate decision; this play is additive, so running it twice changes nothing the second time.
#
# It does NOT reach the workers. The inventory is a control-plane fact -- `lab_fleet_workers` is resolved
# here and handed to the lab as `A11Y_WORKERS`, and `gates/fleet.mjs` reads that env first for exactly
# this reason. A worker box has never needed the file and this does not give it one.
# ## It targets localhost, and the first version did not — a bootstrap circularity
#
# Written as `hosts: control_plane`, which is a group DEFINED IN THE INVENTORY THIS INSTALLS. On the one
# machine that needs it — the machine whose copy a pull had just deleted — ansible could not parse the
# inventory, so the play matched no hosts and the zero-host guard refused it. The play that fixes the
# missing inventory needed the missing inventory to find its own target.
#
# It does not need one. `fleet-playbook.mjs` already starts this as a systemd unit ON the control plane, so
# the file is being written to the machine the play is running on. `localhost` with a local connection has
# no inventory dependency at all, which is what a bootstrap step must not have.
#
# Caught by the zero-host refusal added in the same session, within minutes of it being written, on its
# author's own playbook. That is the guard doing exactly what it exists for: ansible exited 0 having
# matched nothing.
# a11y_bootstrap: true
#
# THE DECLARATION IS HERE, not in the wrapper, and that is the whole safety of the exception.
#
# `fleet-playbook.mjs` reads this marker to decide the playbook runs FROM the operator's machine with the
# control plane named on the command line, rather than as a systemd unit ON the control plane. A hardcoded
# list in the wrapper would let a second playbook acquire the exception by copy-paste with nobody arguing
# for it -- which is the real risk, not the first exception.
#
# THE RULE, and it is general rather than "this file is special": a playbook that BOOTSTRAPS the control
# plane runs from the operator's machine with its target on the command line, and it is the only kind that
# may. `bootstrap-playbooks-are-declared.test.ts` DISCOVERS every playbook carrying this marker and refuses
# one that also targets `a11y_workers` or `control_plane` -- because a bootstrap step must depend on
# NOTHING it is bootstrapping, and both of those groups come from the file this installs.
#
# The systemd-unit path exists for a measured reason (2026-09-05: a caller killed 100 s into a ten-machine
# reboot, the unit survived). A sub-second file copy has nothing to outlive, which is what makes this
# exception principled rather than convenient. A playbook that takes MINUTES must never carry this marker.
- name: Make the control plane's inventory the one source, and this machine's copy derived from it
  hosts: all
  gather_facts: false
  vars:
    inventory_source: "{{ playbook_dir }}/inventory.yml"
    inventory_destination: /etc/a11ign/inventory.yml
    drift_script: >-
      import { readFileSync } from "node:fs";
      import { inventoryDrift } from "{{ playbook_dir }}/../src/control-plane-fleet.mjs";
      const [source, copy] = process.argv.slice(1).map((path) => readFileSync(path, "utf8"));
      console.log(JSON.stringify(inventoryDrift({ source, copy })));

  tasks:
    - name: What the control plane holds now
      ansible.builtin.stat:
        path: "{{ inventory_destination }}"
        checksum_algorithm: sha256
      register: held

    - name: What THIS machine holds now
      ansible.builtin.stat:
        path: "{{ inventory_source }}"
        checksum_algorithm: sha256
      register: mine
      delegate_to: localhost

    - name: Seed the control plane from this machine, because it holds no copy of its own
      when: not held.stat.exists
      block:
        - name: The source must exist, and saying so beats installing an empty file
          # An absent source with `copy` would be a task error; naming it here says WHICH file and on which
          # machine, because "no such file" about a gitignored path is the least useful message available.
          ansible.builtin.assert:
            that: mine.stat.exists
            fail_msg: >-
              {{ inventory_source }} is not on the OPERATOR'S machine and the control plane holds none, so
              there is nothing to install. It is gitignored and a pull deletes it -- restore it here first
              from wherever secrets are kept.

        - name: The directory it lives in
          ansible.builtin.file:
            path: "{{ inventory_destination | dirname }}"
            state: directory
            mode: "0750"

        - name: Install it
          ansible.builtin.copy:
            src: "{{ inventory_source }}"
            dest: "{{ inventory_destination }}"
            mode: "0640"

    - name: Derive this machine's copy from the control plane's
      when: held.stat.exists and (not mine.stat.exists or mine.stat.checksum != held.stat.checksum)
      block:
        - name: A place on this machine to read the control plane's copy into
          ansible.builtin.tempfile:
            state: file
            suffix: .inventory.yml
          register: fetched
          delegate_to: localhost

        - name: Read the control plane's copy (`fetch` checks the checksum it arrived with)
          ansible.builtin.fetch:
            src: "{{ inventory_destination }}"
            dest: "{{ fetched.path }}"
            flat: true

        - name: Say what this machine's copy was missing, from the one comparison the tests pin
          # The same SHA-256 stat as above decided there is a difference to describe; WHAT differs is
          # `inventoryDrift`, in code, so this play carries no second reading of an inventory.
          ansible.builtin.command:
            argv: [node, --input-type=module, -e, "{{ drift_script }}", "{{ fetched.path }}", "{{ inventory_source }}"]
          register: drift_read
          changed_when: false
          delegate_to: localhost
          when: mine.stat.exists

        - name: Report it, loudly
          ansible.builtin.debug:
            msg: "{{ inventory_source }}: {{ (drift_read.stdout | from_json).report | default('names the same workers; the bytes differ', true) }}"
          when: mine.stat.exists

        - name: Refuse to overwrite a copy that is AHEAD of the source
          ansible.builtin.assert:
            that: (drift_read.stdout | from_json).extra | length == 0
            fail_msg: >-
              {{ inventory_source }} names workers the control plane's {{ inventory_destination }} does not
              ({{ (drift_read.stdout | from_json).report }}). Overwriting it would lose them unseen. The
              control plane's file is the one source: add them THERE, then run this again -- or delete the
              local file if it was never meant to differ.
          when: mine.stat.exists

        - name: Write this machine's copy
          ansible.builtin.copy:
            src: "{{ fetched.path }}"
            dest: "{{ inventory_source }}"
            mode: "0640"
          delegate_to: localhost

      always:
        - name: The temporary read is not left behind
          ansible.builtin.file:
            path: "{{ fetched.path }}"
            state: absent
          when: fetched.path is defined
          delegate_to: localhost

    - name: What is on the control plane now
      # PROVE IT, over a read that shares no failure mode with the write. `copy` reporting changed says the
      # module ran; a hash read back says the bytes are there. This repo's own rule -- a verification that
      # shares a failure mode with the action verifies nothing.
      ansible.builtin.stat:
        path: "{{ inventory_destination }}"
        checksum_algorithm: sha256
      register: landed

    - name: And what this machine holds now
      ansible.builtin.stat:
        path: "{{ inventory_source }}"
        checksum_algorithm: sha256
      register: expected
      delegate_to: localhost

    - name: They must match, byte for byte
      ansible.builtin.assert:
        that: landed.stat.checksum == expected.stat.checksum
        # EVERY value in this message is `| default`-guarded, because a failing assert whose OWN message
        # cannot render reports an Ansible templating error instead of the fault: "object of type 'dict'
        # has no attribute 'checksum'" rather than "the file did not arrive". `stat` returns a dict with
        # no `checksum` when the file is absent -- which is exactly the case this assert exists to catch.
        # A guard that stops the job and explains nothing gets distrusted, then bypassed.
        fail_msg: >-
          {{ inventory_destination }} is {{ landed.stat.checksum | default('ABSENT') }} but this machine's
          {{ inventory_source }} is {{ expected.stat.checksum | default('ABSENT') }}. The two are NOT one
          inventory; do not deploy until this is resolved.
        success_msg: >-
          {{ inventory_destination }} and {{ inventory_source }} are one inventory, sha256
          {{ landed.stat.checksum }}. `ansible.cfg` reads the control plane's path first, so a future
          `git pull` there can no longer take the fleet definition with it.
